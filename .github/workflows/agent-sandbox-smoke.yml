name: Agent sandbox smoke

# A PR can exercise the nested sandbox without a model key or Figma grant.
on:
  pull_request:
    paths:
      - Dockerfile
      - scripts/opencode-runner.ts
      - scripts/verify-opencode-cli.ts
      - scripts/opencode-smoke-fixture.ts
      - scripts/copilot-runner.ts
      - scripts/antigravity-runner.ts
      # The catalog check reads the Antigravity model from the registry, so a model change must run the smoke.
      - agents/registry.yaml
      - agents/agent-seccomp.json
      - agents/agent-apparmor.profile
      - .github/workflows/agent-run.yml
      - docs/agents/workflows/agent-run.yml
      - .github/workflows/agent-sandbox-smoke.yml
      - docs/agents/workflows/agent-sandbox-smoke.yml

permissions:
  contents: read

jobs:
  sandbox:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the agent image
        run: docker build --target agent-runner -t artemis-ii-sandbox-smoke .

      - name: Load the nested sandbox AppArmor profile
        run: sudo apparmor_parser -r agents/agent-apparmor.profile

      - name: Check the nested Codex sandbox
        run: |
          set -euo pipefail
          docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --security-opt apparmor=artemis-ii-agent-bwrap \
            --security-opt "seccomp=$GITHUB_WORKSPACE/agents/agent-seccomp.json" --pids-limit 4096 \
            -v "$GITHUB_WORKSPACE:/work" -v "$GITHUB_WORKSPACE/.git:/work/.git:ro" -w /work \
            artemis-ii-sandbox-smoke bwrap --unshare-user --unshare-pid --ro-bind / / -- true
          docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --security-opt apparmor=artemis-ii-agent-bwrap \
            --security-opt "seccomp=$GITHUB_WORKSPACE/agents/agent-seccomp.json" --pids-limit 4096 \
            -v "$GITHUB_WORKSPACE:/work" -v "$GITHUB_WORKSPACE/.git:/work/.git:ro" -w /work \
            --tmpfs "/home/agent:uid=$(id -u),gid=$(id -g),mode=0700,exec" -e HOME=/home/agent \
            artemis-ii-sandbox-smoke codex sandbox -c sandbox_mode=workspace-write -c sandbox_workspace_write.network_access=true -- /bin/sh -c '
              set -eu
              probe=$(mktemp /work/.sandbox-smoke.XXXXXX)
              printf sandbox-ok > "$probe"
              test "$(cat "$probe")" = sandbox-ok
              if ( : > /work/.git/sandbox-smoke-write ) 2>/dev/null; then
                echo ".git unexpectedly writable" >&2
                exit 1
              fi
              rm -f "$probe"
            '

      - name: Remove the nested sandbox AppArmor profile
        if: always()
        run: sudo apparmor_parser -R agents/agent-apparmor.profile || true

      - name: Verify OpenCode with a local scripted model and no real credential
        run: |
          set -euo pipefail
          docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
            --tmpfs "/home/agent:uid=$(id -u),gid=$(id -g),mode=0700,exec" -e HOME=/home/agent \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            artemis-ii-sandbox-smoke bash -c 'test -r /opt/artemis/opencode-runner.ts && test ! -w /opt/artemis/opencode-runner.ts && node scripts/verify-opencode-cli.ts'

      # No credential: only that the image holds the pinned CLI and a launcher the agent's user cannot change.
      - name: Check the pinned Copilot CLI and its root-owned launcher
        run: |
          set -euo pipefail
          docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
            --tmpfs "/home/agent:uid=$(id -u),gid=$(id -g),mode=0700,exec" -e HOME=/home/agent -e CI=true \
            artemis-ii-sandbox-smoke bash -c 'test -r /opt/artemis/copilot-runner.ts && test ! -w /opt/artemis/copilot-runner.ts \
              && copilot --version | grep -q "^GitHub Copilot CLI " && ! node /opt/artemis/copilot-runner.ts validate auto'

      # No credential: the pinned Antigravity binary is root-owned and read-only to the agent, and so is its launcher.
      - name: Check the pinned Antigravity CLI and its root-owned launcher
        run: |
          set -euo pipefail
          docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
            --tmpfs "/home/agent:uid=$(id -u),gid=$(id -g),mode=0700,exec" -e HOME=/home/agent -e CI=true \
            artemis-ii-sandbox-smoke bash -c 'test -r /opt/artemis/antigravity-runner.ts && test ! -w /opt/artemis/antigravity-runner.ts \
              && test ! -w /opt/agy/antigravity && agy --version | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$" \
              && ! node /opt/artemis/antigravity-runner.ts validate auto'

      # No key: the model in the registry must be in the pinned CLI's catalog. `agy models` lists the catalog whatever the
      # key, so a typo or a retired slug fails here, in the PR, and not in the paid smoke.
      - name: Check that the registry's Antigravity model is in the pinned CLI's catalog
        run: |
          set -euo pipefail
          MODEL=$(awk '/^- id: antigravity/{f=1;next} /^- id:/{f=0} f&&/^  model:/{print $2; exit}' agents/registry.yaml)
          [ -n "$MODEL" ] || { echo "The antigravity agent has no model in the registry."; exit 1; }
          docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
            --tmpfs "/home/agent:uid=$(id -u),gid=$(id -g),mode=0700,exec" -e HOME=/home/agent -e CI=true \
            artemis-ii-sandbox-smoke node /opt/artemis/antigravity-runner.ts check-model "$MODEL"

      # A dummy key, not a credential: the launcher's Gemini API settings must make the CLI call the API and fail fast
      # with an API error, never start a browser sign-in and wait.
      - name: Check that Antigravity uses the API key path and never waits for a sign-in
        run: |
          set -euo pipefail
          OUT=$(docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
            --tmpfs "/home/agent:uid=$(id -u),gid=$(id -g),mode=0700,exec" -e HOME=/home/agent -w /home/agent \
            -e FIGMA=none -e ANTIGRAVITY_MODEL=gemini-3.8-flash -e GEMINI_API_KEY=not-a-real-key \
            artemis-ii-sandbox-smoke timeout 120 node /opt/artemis/antigravity-runner.ts run 'Say hello.' 2>&1 < /dev/null) && { echo "A dummy key must not succeed."; exit 1; }
          echo "$OUT"
          echo "$OUT" | grep -q 'AGY_ERROR INVALID_ARGUMENT 400' || { echo "Expected an API error for the dummy key."; exit 1; }
          if echo "$OUT" | grep -q 'interactive sign-in'; then echo "The CLI asked for a browser sign-in."; exit 1; fi

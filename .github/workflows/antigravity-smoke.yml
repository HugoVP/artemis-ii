name: Antigravity smoke

# Proposed workflow: Hugo copies it to .github/workflows/antigravity-smoke.yml.
# Trusted fixture only: no stage, repository edits, PR publication or deployment. Contract: docs/specs/antigravity-runner.md.
on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: antigravity-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && github.actor == vars.AGENT_TRUSTED_LOGIN && github.triggering_actor == vars.AGENT_TRUSTED_LOGIN
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: agents
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ vars.AGENT_RUNNER_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate the model and prepare a fixed fixture
        run: |
          set -euo pipefail
          ANTIGRAVITY_MODEL=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {parseRegistry} from "./scripts/agent-checks.ts"; console.log(parseRegistry(readFileSync("agents/registry.yaml", "utf8")).find(agent => agent.id === "antigravity")?.model ?? "")')
          node scripts/antigravity-runner.ts validate "$ANTIGRAVITY_MODEL"
          echo "ANTIGRAVITY_MODEL=$ANTIGRAVITY_MODEL" >> "$GITHUB_ENV"
          node scripts/opencode-smoke-fixture.ts prepare "$RUNNER_TEMP/agy-work"
          git -C "$RUNNER_TEMP/agy-work" init -q

      - name: Pull the digest-pinned runner image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || { echo "AGENT_RUNNER_IMAGE must be pinned by digest."; exit 1; }
          export DOCKER_CONFIG="$RUNNER_TEMP/agy-login"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull -q "$IMAGE"
          docker logout ghcr.io >/dev/null
          rm -r -- "$DOCKER_CONFIG"
          docker run --rm --network none --entrypoint cat "$IMAGE" /etc/passwd > "$RUNNER_TEMP/agy-passwd"
          printf 'agent:x:%s:%s::/home/agent:/bin/bash\n' "$(id -u)" "$(id -g)" >> "$RUNNER_TEMP/agy-passwd"

      - name: Run Antigravity on the fixture
        env:
          GEMINI_API_KEY: ${{ secrets.AGENT_KEY_ANTIGRAVITY }}
        run: |
          set -euo pipefail
          docker run --rm --init --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 \
            -v "$RUNNER_TEMP/agy-passwd:/etc/passwd:ro" --tmpfs "/home/agent:uid=$(id -u),gid=$(id -g),mode=0700,exec" \
            -e HOME=/home/agent -e FIGMA=none -e ANTIGRAVITY_MODEL -e GEMINI_API_KEY \
            -v "$RUNNER_TEMP/agy-work:/work" -v "$RUNNER_TEMP/agy-work/.git:/work/.git:ro" \
            -w /work \
            "$IMAGE" node /opt/artemis/antigravity-runner.ts run 'Read AGENTS.md and complete only the fixed smoke task described there.' < /dev/null

      - name: Verify the fixture outside the agent container
        run: node scripts/opencode-smoke-fixture.ts verify "$RUNNER_TEMP/agy-work"

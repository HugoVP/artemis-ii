name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar si el proyecto ya existe
        id: project
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Todavía no hay package.json (Etapa 00). Se omite el build."
          fi

      - uses: actions/setup-node@v4
        if: steps.project.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: steps.project.outputs.exists == 'true'
        run: npm ci

      - name: Revisar tipos
        if: steps.project.outputs.exists == 'true'
        run: npm run check --if-present

      - name: Build
        if: steps.project.outputs.exists == 'true'
        run: npm run build

name: Deploy production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (rollback)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      tag: ${{ steps.verify.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      EVENT_NAME: ${{ github.event_name }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      RUN_SHA: ${{ github.sha }}
    steps:
      - name: Validate dispatch ref
        run: |
          if [ "${EVENT_NAME}" = workflow_dispatch ] && { [ "${REF_TYPE}" != tag ] || [ "${REF_NAME}" != "${TAG}" ]; }; then
            echo "Run rollback from the same release tag as the tag input."
            exit 1
          fi
      - name: Verify release, commit on main and green staging run
        id: verify
        run: |
          set -euo pipefail
          case "${TAG}" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Not a release tag: ${TAG}"; exit 1;; esac
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          [ "$(echo "${release}" | jq -r '.draft')" = "false" ] || { echo "Release is a draft"; exit 1; }
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)
          [ "${sha}" = "${RUN_SHA}" ] || { echo "Release tag does not match the triggering commit"; exit 1; }
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${sha}...main" --jq .status)
          case "${status}" in identical|ahead) ;; *) echo "Commit ${sha} is not on main"; exit 1;; esac
          ok=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-staging.yml/runs?head_sha=${sha}&status=success&event=push&branch=main" --jq '.total_count')
          [ "${ok}" -ge 1 ] || { echo "No successful main push staging run for ${sha}"; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate media without credentials
        run: |
          mkdir -p media-out
          if [ -f scripts/ingest.ts ]; then
            npm run ingest -- --build --out media-out
          else
            echo '{"photos":[]}' > media-out/manifest.json
          fi
      - run: npm run build
        env:
          MEDIA_BASE_URL: /media
          SITE_URL: ${{ vars.SITE_URL_PRODUCTION }}
      - name: Package and validate the complete static site
        run: node scripts/package-media.ts media-out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-dist
          path: dist

  deploy:
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-dist
          path: site
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate Pages artifact limits without executing artifact code
        run: |
          node --input-type=module-typescript <<'TYPESCRIPT'
          import { lstat, readdir } from 'node:fs/promises';
          import { join } from 'node:path';
          const root = 'site';
          let count = 0;
          async function walk(directory: string): Promise<void> {
            for (const name of await readdir(directory)) {
              const path = join(directory, name);
              const info = await lstat(path);
              if (info.isSymbolicLink() || (!info.isDirectory() && !info.isFile())) {
                throw new Error(`Non-regular entry forbidden: ${path}`);
              }
              if (info.isDirectory()) await walk(path);
              else {
                if (info.size > 26214400) throw new Error(`Pages file exceeds 25 MiB: ${path}`);
                if (++count > 20000) throw new Error('Pages file count exceeds 20000');
              }
            }
          }
          await walk(root);
          if (!(await lstat(join(root, 'index.html'))).isFile()) throw new Error('Missing site/index.html');
          if ((await readdir(root)).includes('functions')) throw new Error('Pages Functions forbidden');
          console.log(`Validated ${count} static files`);
          TYPESCRIPT
      - name: Reject Pages Worker entrypoints
        run: |
          if [ -e site/_worker.js ] || [ -L site/_worker.js ]; then
            echo "Refusing a Pages Worker entrypoint in the static artifact."
            exit 1
          fi
      - run: rm -f site/wrangler.toml site/wrangler.json site/wrangler.jsonc
      - name: Upload to the production Pages project
        run: npx --yes wrangler@4.151.1 pages deploy site --project-name=artemis-ii --branch=main --commit-hash="${SHA}" --commit-dirty=true

  smoke:
    needs: [gate, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/smoke.ts "${SITE_URL}"
        env:
          SITE_URL: ${{ vars.SITE_URL_PRODUCTION }}

name: Deploy staging

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  media:
    uses: ./.github/workflows/media.yml
    with:
      target: staging
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL_STAGING }}
          SITE_URL: ${{ vars.SITE_URL_STAGING }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-dist
          path: dist

  deploy:
    needs: [media, build]
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-dist
          path: site
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Reject Pages Worker entrypoints
        run: |
          if [ -e site/_worker.js ] || [ -L site/_worker.js ]; then
            echo "Refusing a Pages Worker entrypoint in the static artifact."
            exit 1
          fi
      - run: rm -f site/wrangler.toml site/wrangler.json site/wrangler.jsonc
      - name: Upload to the staging Pages project
        run: npx --yes wrangler@4.151.1 pages deploy site --project-name=artemis-ii-staging --branch=main --commit-hash="${GITHUB_SHA}" --commit-dirty=true

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/smoke.ts "${SITE_URL}"
        env:
          SITE_URL: ${{ vars.SITE_URL_STAGING }}

  links:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # QA-04: report-only until Stage 11; a broken external link does not fail staging.
      - name: Link report
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL_STAGING }}
        run: |
          mkdir -p reports/links
          npx --yes linkinator@8.1.0 "${SITE_URL%/}/es/" "${SITE_URL%/}/en/" --recurse --sitemap-url="${SITE_URL%/}/sitemap-index.xml" --check-fragments --format=json --concurrency=5 --timeout=10000 > reports/links/staging.json 2> reports/links/staging.log
      - name: Retain link report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-link-report
          path: reports/links
          retention-days: 7

name: Linear sync

# Moves each stage's Linear issue forward to the status `docs/PLAN.md` says. Runs only from `main`
# (or by hand), and the `linear` environment only gives its secret to `main`, so PR code never sees it.
# It only writes when the variable `LINEAR_SYNC_APPLY` is `true`; until then every run is a dry run.
on:
  push:
    branches: [main]
    paths:
      - docs/PLAN.md
      - scripts/linear-sync.ts
      - scripts/next-stage-issue.ts
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read Linear and print the changes without applying them
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: linear
    concurrency:
      group: linear-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Unit tests (mock server, no network, no credentials)
        run: node --test scripts/linear-sync.test.ts scripts/next-stage-issue.test.ts

      - name: Move the Linear issues forward to match docs/PLAN.md
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # Writes are off until the variable LINEAR_SYNC_APPLY is `true` in the `linear` environment.
          # A manual run is also a dry run while its box is ticked.
          DRY_RUN: ${{ (vars.LINEAR_SYNC_APPLY != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && '1' || '' }}
        run: node scripts/linear-sync.ts

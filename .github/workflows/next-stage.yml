name: Next stage work order

# `pull_request_target` runs the workflow from `main`, so a PR cannot edit it. It checks out `main`
# only and never PR code. The job has no secrets: only the automatic token, limited to issues.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  work-order:
    # Merged, from a branch of this repository (never a fork), and a stage PR (title starts with "Stage ").
    # The title is only used in this condition, never in a shell command.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'Stage ')
    concurrency:
      group: next-stage-work-order
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Unit tests (mock server, no network)
        run: node --test scripts/next-stage-issue.test.ts

      - name: Open the work order for the next stage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/next-stage-issue.ts

name: Notion sync

on:
  push:
    branches: [main]
    paths:
      - docs/PLAN.md
      - scripts/notion-sync.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Credentials live in this environment, restricted to `main`.
    environment: notion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Unit tests (no network, no credentials)
        run: node --test scripts/*.test.ts

      - name: Publish docs/PLAN.md to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
        run: node scripts/notion-sync.ts

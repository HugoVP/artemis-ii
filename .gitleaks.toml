[extend]
useDefault = true

# This is the design file's public identifier, also present in design.md's URL, not an OAuth token.
# Historical and current mock-server tests use it to verify the gateway's file restriction.
# All three conditions must match; other values, files and detection rules remain checked.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public Figma design file ID used by mock-server tests"
condition = "AND"
regexTarget = "secret"
paths = ['''^scripts/figma-(mcp-gateway|snapshot)\.test\.(mjs|ts)$''']
regexes = ['''^7b6W4tsb9Ia0J0KhyvBWCX$''']

# A photo's pathKey is its public NASA image ID (for example KSC-20260410-PH-JNV01_0001), used as the media folder
# name and in the original's public URL. The rule reads "...Key" plus an ID with many letters and digits as a key.
# All three conditions must match: only these files, only a pathKey assignment, only verified NASA image ID forms.
[[rules.allowlists]]
description = "Public NASA image IDs stored as photo path keys"
condition = "AND"
regexTarget = "match"
paths = ['''^(media-lock\.json|src/content/photos/[A-Za-z0-9_.\-]+\.json|scripts/ingest\.test\.ts)$''']
regexes = ['''pathKey[\x22\x27]?\s*[:,]\s*[\x22\x27](art002e[0-9]{6}|NHQ[0-9]{12}|AFRC[0-9]{4}-[0-9]{4}-[0-9]{2}|KSC-[0-9]{8}-(PH-[A-Z]{3}[0-9]{2}[_-][0-9]{4}|KED[0-9]{2}-[0-9]{4}|Artemis_II_Launch-[0-9]+)|Artemis_II_at_the_pad_Moon_[0-9]{8}_[0-9]+|SLS_MAF_[0-9]{8}_ArtemisIILaunch_[0-9]{2})[\x22\x27]?$''']

  - nasaId: "art002e009575"
    mediaFolder: "art002e009575"
    curationRef: "Mission 20"
    chapter: "eclipse"
    displayOrder: 4
    date: "2026-04-06"
    dateConflict:
      status: "resolved-per-caption"
      summary: "The library `date_created` index is 2026-04-07 (from UTC camera filename `cmasaw3_20260407012240_013.JPG`), while the description dates the eclipse to April 6, 2026."
      proposedResolution: "Use 2026-04-06 (the described EDT event date, per CURATION.md) while noting the April 7 UTC index date."
      sources:
        - "https://images.nasa.gov/details/art002e009575"
    camera: "Orion solar array wing camera"
    credit: "NASA"
    originalUrl: "https://images-assets.nasa.gov/image/art002e009575/art002e009575~orig.jpg"
    title:
      es: "Amanecer solar tras el borde de la Luna para Orion"
      en: "Sunlight reappearing at the lunar limb for Orion"
    caption:
      es: "El Sol vuelve a asomar por el borde izquierdo de la Luna el 6 de abril de 2026, poniendo fin al eclipse solar total con la nave Orion en primer plano. Esta fotografía muestra el regreso de la luz solar y las condiciones de observación, no un destello de impacto individual."
      en: "The Sun rises at the left edge of the Moon on April 6, 2026, ending the total solar eclipse with the Orion spacecraft in the foreground. This frame illustrates the return of sunlight and the eclipse viewing geometry, not an individual impact flash."
    alt:
      es: "La nave Orion y un panel solar en primer plano frente al disco oscuro de la Luna, en cuyo borde izquierdo estalla el destello brillante del Sol al reaparecer."
      en: "The Orion spacecraft and a solar array wing in the foreground facing the dark lunar disk, with a brilliant burst of sunlight emerging at the Moon's left edge."
    story:
      es: >-
        Mientras el Sol permaneció oculto detrás de la Luna el 6 de abril de 2026, el hemisferio lunar situado frente a Orion quedó sumergido en la oscuridad, creando una oportunidad excepcional para buscar destellos de impacto: chispazos breves de luz producidos cuando meteoroides que viajan a miles de millas por hora chocan contra el suelo lunar. En su comunicación por radio con la Tierra a las 9:00 p. m. EDT, recogida en el pie de foto original de esta imagen, la tripulación informó haber visto seis destellos; tras revisar las grabaciones y notas de voz, el informe preliminar de ciencia lunar actualizado el 7 de octubre de 2026 confirmó cinco destellos puntuales observados a unas 46.000 millas de distancia.
      en: >-
        While the Sun hid behind the Moon on April 6, 2026, the lunar hemisphere facing Orion lay in darkness, offering a rare chance to watch for meteoroid impact flashes—brief pinpricks of light created when meteoroids traveling thousands of miles per hour strike the lunar surface. Calling down to Earth at 9:00 p.m. EDT, as recorded in this photograph's initial caption, the crew reported seeing six flashes; after cross-checking the mission recordings and voice logs, the preliminary lunar science report updated on October 7, 2026, confirmed five impact flashes observed from roughly 46,000 miles away.
      facts:
        - id: "story-eclipse-20-impact-flashes-update"
          claim:
            es: "Durante el eclipse del 6 de abril de 2026, la tripulación comunicó inicialmente a las 9:00 p. m. ET haber visto seis destellos de impacto de meteoroides (según el registro de art002e009575); el informe preliminar de ciencia lunar actualizado el 7 de octubre de 2026 confirma cinco destellos observados a unas 46.000 millas de la Luna."
            en: "During the April 6, 2026 eclipse, the crew initially reported at 9:00 p.m. ET seeing six meteoroid impact flashes (per the art002e009575 record); the preliminary lunar science report updated October 7, 2026, confirms five impact flashes observed from roughly 46,000 miles away."
          sources:
            - title: "NASA Image and Video Library: art002e009575"
              url: "https://images.nasa.gov/details/art002e009575"
              accessed: "2026-10-20"
            - title: "Artemis II Preliminary Lunar Science Report (updated October 7, 2026)"
              url: "https://science.nasa.gov/feature/artemis-ii-preliminary-lunar-science-report/"
              accessed: "2026-10-20"
    facts:
      - id: "photo-eclipse-20-sunrise"
        claim:
          es: "La fotografía art002e009575 (tomada el 6 de abril de 2026 e indexada el 7 de abril en UTC) muestra al Sol reapareciendo en el borde izquierdo de la Luna con Orion en primer plano al concluir el eclipse solar total."
          en: "Photograph art002e009575 (taken April 6, 2026, and indexed April 7 in UTC) shows the Sun reappearing at the left edge of the Moon with Orion in the foreground at the end of the total solar eclipse."
        sources:
          - title: "NASA Image and Video Library: art002e009575"
            url: "https://images.nasa.gov/details/art002e009575"
            accessed: "2026-10-20"


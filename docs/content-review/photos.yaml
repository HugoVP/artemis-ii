  - nasaId: "NHQ202604010227"
    mediaFolder: "NHQ202604010227"
    curationRef: "Launch 6"
    chapter: "launch"
    displayOrder: 6
    date: "2026-04-01"
    camera: null
    credit: "NASA/Bill Ingalls"
    originalUrl: "https://images-assets.nasa.gov/image/NHQ202604010227/NHQ202604010227~orig.jpg"
    title:
      es: "Despegue reflejado en las aguas del Centro Espacial Kennedy"
      en: "Liftoff reflected across the waters of Kennedy Space Center"
    caption:
      es: "El resplandor de los motores RS-25 y de los dos propulsores sólidos del cohete SLS se refleja en una laguna cercana mientras Artemis II asciende desde el Complejo de Lanzamiento 39B a las 6:35 p. m. EDT del miércoles 1 de abril de 2026 con Reid Wiseman, Victor Glover, Christina Koch y Jeremy Hansen a bordo."
      en: "The glare of the SLS rocket's RS-25 engines and twin solid rocket boosters reflects across a foreground lagoon as Artemis II climbs from Launch Complex 39B at 6:35 p.m. EDT on Wednesday, April 1, 2026, carrying Reid Wiseman, Victor Glover, Christina Koch, and Jeremy Hansen."
    alt:
      es: "El cohete SLS asciende sobre una intensa columna de fuego dorado al atardecer, con la estela luminosa y las nubes de humo reflejadas en una laguna tranquila en primer plano."
      en: "The SLS rocket climbing on a brilliant golden pillar of flame at dusk, with its fiery plume and smoke clouds mirrored in a calm foreground lagoon."
    story:
      es: >-
        La partida hacia la Luna comenzó mucho antes de que los motores encendieran el cielo de Florida. Durante la tarde del 1 de abril de 2026, tras verificar la estanqueidad de sus trajes naranjas de supervivencia en el edificio Neil A. Armstrong y despedirse de sus familias, Reid Wiseman, Victor Glover, Christina Koch y Jeremy Hansen recorrieron el camino hacia la plataforma 39B e ingresaron uno por uno a la cabina de Orion desde la Sala Blanca. Cuando el reloj marcó las 6:35 p. m. EDT, los cuatro motores RS-25 y los dos propulsores sólidos despertaron con 8,8 millones de libras de empuje: una columna incandescente que duplicó su brillo sobre el agua quieta de los humedales antes de abrirse paso hacia la órbita terrestre y el espacio profundo.
      en: >-
        Departure for the Moon began hours before rocket exhaust lit the Florida sky. On the afternoon of April 1, 2026, after completing leak checks on their orange survival suits inside the Neil A. Armstrong Operations and Checkout Building and waving to their families outside, Reid Wiseman, Victor Glover, Christina Koch, and Jeremy Hansen rode to Pad 39B and climbed one by one through the White Room into Orion's crew module. When the clock reached 6:35 p.m. EDT, the four RS-25 engines and twin solid rocket boosters roared to life with 8.8 million pounds of thrust—an incandescent column that doubled its glow across the still marsh waters before arcing out over the Atlantic toward deep space.
      facts:
        - id: "story-launch-6-departure"
          claim:
            es: "El 1 de abril de 2026, tras las revisiones de trajes y la caminata de salida en el edificio Neil A. Armstrong, Wiseman, Glover, Koch y Hansen despegaron a las 6:35 p. m. EDT desde el Complejo de Lanzamiento 39B con 8,8 millones de libras de empuje."
            en: "On April 1, 2026, following suit checks and walkout from the Neil A. Armstrong Operations and Checkout Building, Wiseman, Glover, Koch, and Hansen lifted off at 6:35 p.m. EDT from Launch Complex 39B under 8.8 million pounds of thrust."
          sources:
            - title: "NASA Image and Video Library: NHQ202604010227"
              url: "https://images.nasa.gov/details/NHQ202604010227"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: AFRC2026-0068-03"
              url: "https://images.nasa.gov/details/AFRC2026-0068-03"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: KSC-04012026-Artemis II_Launch-1"
              url: "https://images.nasa.gov/details/KSC-04012026-Artemis%20II_Launch-1"
              accessed: "2026-10-20"
            - title: "NASA Blog: Live Artemis II Launch Day Updates (April 1, 2026)"
              url: "https://www.nasa.gov/blogs/missions/2026/04/01/live-artemis-ii-launch-day-updates/"
              accessed: "2026-10-21"
    facts:
      - id: "photo-launch-6-ingalls-liftoff"
        claim:
          es: "El cohete SLS con la nave Orion y los astronautas Wiseman, Glover, Koch y Hansen despegó a las 6:35 p. m. EDT del 1 de abril de 2026 desde el Complejo de Lanzamiento 39B."
          en: "The SLS rocket carrying Orion and astronauts Wiseman, Glover, Koch, and Hansen launched at 6:35 p.m. EDT on April 1, 2026, from Launch Complex 39B."
        sources:
          - title: "NASA Image and Video Library: NHQ202604010227"
            url: "https://images.nasa.gov/details/NHQ202604010227"
            accessed: "2026-10-20"


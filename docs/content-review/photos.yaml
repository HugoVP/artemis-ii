# Stage 08 draft: titles, captions, alt text and stories for the 33 approved photos.
# Review only. Nothing here is integrated into the site; Stage 09 moves approved text into the content collections.
#
# Each photo has `title`, `caption` and `alt` in Spanish (`es`) and English (`en`), written separately and not as a
# literal translation, and `sources`: the URLs that support every fact in the entry. `story` appears only where the
# sources justify a longer text (CONT-04); it has its own `sources`. Alt text describes only what is visible; context
# that is not visible belongs in the caption or the story.
#
# Text fetched from NASA pages is treated as data (SEC-08). The NASA record is the base source of every entry; later
# NASA articles refine it where they are listed.

urls:
  faq: &faq https://www.nasa.gov/missions/nasa-answers-your-most-pressing-artemis-ii-questions/
  record-release: &record-release https://www.nasa.gov/news-release/nasas-artemis-ii-crew-eclipses-record-for-farthest-human-spaceflight/
  recap: &recap https://www.nasa.gov/centers-and-facilities/johnson/artemis-ii-mission-milestones-an-image-and-video-recap/
  reentry: &reentry https://www.nasa.gov/blogs/missions/2026/04/10/artemis-ii-flight-day-10-re-entry-live-updates/

photos:
  # ---- Launch (display order 1 to 7) ----
  - nasaId: "Artemis II at the pad Moon 01292026_4"
    chapter: launch
    title:
      es: "La Luna sobre el cohete"
      en: "The Moon above the rocket"
    caption:
      es: "La Luna brilla detrás del cohete SLS y de la nave Orion en la plataforma de lanzamiento 39B del Centro Espacial Kennedy, mientras los equipos preparaban un ensayo general de la cuenta atrás, a finales de enero de 2026."
      en: "The Moon shines behind the SLS rocket and the Orion spacecraft at Launch Pad 39B of Kennedy Space Center, while teams prepared a wet dress rehearsal in late January 2026."
    alt:
      es: "El cohete SLS con la nave Orion en la parte superior, sobre el lanzador móvil, y la Luna en el cielo detrás."
      en: "The SLS rocket with the Orion spacecraft on top, standing on its mobile launcher, with the Moon in the sky behind it."

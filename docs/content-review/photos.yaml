  - nasaId: "art002e000192"
    mediaFolder: "art002e000192"
    curationRef: "Mission 1"
    chapter: "outbound"
    displayOrder: 1
    date: "2026-04-02"
    dateConflict:
      status: "resolved-per-caption"
      summary: "The library `date_created` index is 2026-04-03, while the description body states the photo was taken on April 2, 2026 after the translunar injection burn."
      proposedResolution: "Use 2026-04-02 (the caption-documented capture date, per CURATION.md) and retain the April 3 index date note."
      sources:
        - "https://images.nasa.gov/details/art002e000192"
    camera: null
    credit: "NASA"
    originalUrl: "https://images-assets.nasa.gov/image/art002e000192/art002e000192~orig.jpg"
    title:
      es: "La Tierra nocturna iluminada por la Luna tras la inyección translunar"
      en: "Night Earth lit by moonlight after translunar injection"
    caption:
      es: "Tomada el 2 de abril de 2026 a través de una ventanilla de Orion tras el encendido de inyección translunar, esta imagen muestra el hemisferio nocturno de la Tierra bañado por la luz reflejada de la Luna. Se distinguen África a la izquierda, auroras verdes en los bordes sur (arriba a la izquierda) y norte (abajo a la derecha), una delgada creciente diurna y un cono de luz zodiacal coronado por Venus."
      en: "Captured on April 2, 2026, through an Orion window after the translunar injection burn, this photograph shows Earth's nighttime hemisphere bathed in reflected moonlight. Africa appears on the left, green auroras glow along the southern (upper left) and northern (lower right) limbs, a thin daytime crescent rims the lower right edge, and a cone of zodiacal light topped by Venus extends into space."
    alt:
      es: "El disco de la Tierra visto en la oscuridad del espacio con nubes iluminadas suavemente por la Luna, franjas verdes de aurora en ambos polos y un cono tenue de luz con el punto brillante de Venus a la derecha."
      en: "Earth's disk suspended in dark space with clouds softly lit by moonlight, green aurora bands near both poles, and a faint cone of light crowned by the bright point of Venus to the lower right."
    story:
      es: >-
        A las 7:49 p. m. EDT del 2 de abril de 2026, el motor principal del Módulo de Servicio Europeo se encendió durante casi seis minutos y sacó a Orion de la órbita terrestre para enviarla hacia la Luna. Cuando los astronautas miraron hacia atrás por las ventanillas de la cabina, encontraron una escena engañosa: aunque miraban el lado nocturno del planeta y el Sol quedaba oculto detrás de la Tierra, los océanos, las costas iluminadas y el contorno de África resplandecían bajo el brillo de la Luna llena. En los extremos norte y sur del globo, cortinas de auroras verdes delataban el choque del viento solar con la atmósfera, mientras desde el borde derecho se alzaba en el vacío el cono polvoriento de la luz zodiacal coronado por el planeta Venus.
      en: >-
        At 7:49 p.m. EDT on April 2, 2026, the European Service Module's main engine fired for nearly six minutes, propelling Orion out of Earth orbit on its four-day path to the Moon. Looking back through the cabin windows afterward, the crew met a deceptive sight: although they faced Earth's night side with the Sun hidden behind the planet, cloud decks, city-lit coastlines, and the continent of Africa glowed under reflected moonlight. Along the northern and southern limbs, ribbons of green aurora traced solar particles striking the upper atmosphere, while a translucent cone of zodiacal light—sunlight scattered off interplanetary dust—reached into the blackness toward bright Venus.
      facts:
        - id: "story-outbound-1-tli-and-moonlit-earth"
          claim:
            es: "Capturada el 2 de abril de 2026 tras el encendido de inyección translunar (7:49 p. m. EDT), la imagen muestra la cara nocturna de la Tierra iluminada por la luz lunar, con África a la izquierda, auroras verdes en ambos bordes polares y un cono de luz zodiacal coronado por Venus."
            en: "Taken on April 2, 2026, after the translunar injection burn (7:49 p.m. EDT), the image shows Earth's night hemisphere lit by moonlight, with Africa on the left, green auroras on the southern and northern edges, and a cone of zodiacal light capped by Venus."
          sources:
            - title: "NASA Image and Video Library: art002e000192"
              url: "https://images.nasa.gov/details/art002e000192"
              accessed: "2026-10-20"
            - title: "NASA Blog: Artemis II Flight Day 2 — Orion Completes TLI Burn, Crew Begins Journey to the Moon (April 2, 2026)"
              url: "https://www.nasa.gov/blogs/missions/2026/04/02/artemis-ii-flight-day-2-orion-completes-tli-burn-crew-begins-journey-to-the-moon/"
              accessed: "2026-10-21"
    facts:
      - id: "photo-outbound-1-details"
        claim:
          es: "La fotografía art002e000192 (indexada el 3 de abril de 2026 y tomada el 2 de abril tras la inyección translunar) muestra la Tierra nocturna iluminada por la Luna, auroras verdes al norte y al sur, África, luces costeras y luz zodiacal junto a Venus."
          en: "Photograph art002e000192 (indexed April 3, 2026, and taken April 2 after translunar injection) shows night Earth lit by moonlight, northern and southern green auroras, Africa, coastal city lights, and zodiacal light capped by Venus."
        sources:
          - title: "NASA Image and Video Library: art002e000192"
            url: "https://images.nasa.gov/details/art002e000192"
            accessed: "2026-10-20"


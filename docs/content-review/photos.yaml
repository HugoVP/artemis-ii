  # ---- Far side (display order: 7, 6, 8, 9, 13, 14, 10, 11, 12, 15, 16 in CURATION.md) ----
  - nasaId: art002e009212
    chapter: far-side
    title:
      es: "La Luna entera, con Orientale"
      en: "The whole Moon, with Orientale"
    caption:
      es: "La Luna totalmente iluminada. A la derecha está la cara visible desde la Tierra, con manchas oscuras que son antiguas coladas de lava. Orientale, una cuenca de casi mil kilómetros de ancho (unas 600 millas), se extiende entre la cara visible y la oculta; a su izquierda empieza la cara oculta."
      en: "The Moon fully lit. On the right is the near side, the hemisphere we see from Earth, marked by dark patches that are ancient lava flows. Orientale, a basin nearly 600 miles (about 1,000 km) wide, straddles the near and far sides; the far side begins to its left."
    alt:
      es: "El disco completo de la Luna, con manchas oscuras a la derecha y una gran cuenca circular junto al borde izquierdo."
      en: "The full disk of the Moon, with dark patches on the right and a large circular basin near the left edge."
    sources:
      - https://images.nasa.gov/details/art002e009212

  - nasaId: art002e012090
    chapter: far-side
    title:
      es: "Los anillos de Orientale"
      en: "The rings of Orientale"
    caption:
      es: "Los anillos concéntricos de la cuenca de Orientale, uno de los grandes cráteres de impacto más jóvenes y mejor conservados de la Luna, fotografiados durante el primer turno de observación del sobrevuelo."
      en: "The concentric rings of the Orientale basin, one of the Moon's youngest and best-preserved large impact craters, photographed during the first shift of the flyby observation period."
    alt:
      es: "Vista de la superficie lunar con varios anillos de montañas que rodean de forma concéntrica una cuenca."
      en: "A view of the lunar surface with several rings of mountains circling a basin concentrically."
    sources:
      - https://images.nasa.gov/details/art002e012090
    story:
      es: >-
        Orientale es una cuenca de impacto de casi 600 millas (unos mil kilómetros) de ancho que se extiende entre
        las dos caras de la Luna; desde la Tierra solo se ve la mitad. NASA la describe como uno de los grandes
        cráteres de impacto más jóvenes y mejor conservados de la Luna, y su edad es de unos 3.700 millones de años.
        Los cráteres alineados que salieron de aquel impacto marcan la cuenca de Hertzsprung, así que esta debe ser
        aún más antigua. Al sobrevolar el terminador, la frontera entre el día y la noche, la tripulación la
        describió como «todo menos una línea recta», con bordes de cráteres que sobresalían como «islas» en la
        oscuridad. Los observadores de la época Apolo apodaron «el beso» a un arco de su anillo exterior.
      en: >-
        Orientale is an impact basin nearly 600 miles (about 1,000 km) wide that straddles the Moon's two hemispheres;
        from Earth only half of it can be seen. NASA describes it as one of the Moon's youngest and best-preserved
        large impact craters, about 3.7 billion years old. Chains of craters thrown out by that impact scar the
        Hertzsprung Basin, which means Hertzsprung must be older still. Flying over the terminator, the boundary
        between day and night, the crew described it as "anything but a straight line," with crater rims standing
        out like "islands" in the dark. Observers of the Apollo era nicknamed an arc of its outer ring "the kiss."
      sources:
        - https://images.nasa.gov/details/art002e012090
        - https://images.nasa.gov/details/art002e009212
        - https://images.nasa.gov/details/art002e010208
        - https://images.nasa.gov/details/art002e012273

  - nasaId: art002e010208
    chapter: far-side
    title:
      es: "La frontera entre el día y la noche"
      en: "The edge of darkness"
    caption:
      es: "La tripulación describió el terminador como «todo menos una línea recta». Los bordes de los cráteres destacan como islas en la noche, y las cadenas de cráteres de Orientale llegan casi hasta la línea de sombra."
      en: "The crew described the terminator as \"anything but a straight line.\" Crater rims stand out like islands in the night, and chains of craters from Orientale stretch almost to the shadow line."
    alt:
      es: "Paisaje lunar con una línea irregular de sombra y, en la zona iluminada, cadenas de cráteres que se alejan hacia la oscuridad."
      en: "A lunar landscape with an irregular line of shadow and, in the lit area, chains of craters stretching toward the dark."
    sources:
      - https://images.nasa.gov/details/art002e010208

  - nasaId: art002e012273
    chapter: far-side
    title:
      es: "Un arco de montañas"
      en: "An arc of mountains"
    caption:
      es: "El anillo exterior suroeste de la cuenca de Orientale, un arco de terreno montañoso formado por un impacto antiguo. Los observadores de la época Apolo lo apodaron «el beso»."
      en: "The southwest portion of the Orientale basin's outer ring, a sweeping arc of mountainous terrain formed by an ancient impact. Observers of the Apollo era nicknamed it \"the kiss.\""
    alt:
      es: "Una cadena curva de montañas lunares que traza el borde de una gran cuenca."
      en: "A curved chain of lunar mountains tracing the edge of a large basin."
    sources:
      - https://images.nasa.gov/details/art002e012273

  - nasaId: art002e012153
    chapter: far-side
    title:
      es: "Un cráter para recordar"
      en: "A crater to remember"
    caption:
      es: "La pequeña mancha brillante del centro es el cráter que la tripulación propuso llamar Carroll, en recuerdo de la esposa del comandante Reid Wiseman, fallecida. Mide unos 5,6 km y está en el borde occidental de la cara visible."
      en: "The small bright spot in the center is the crater the crew proposed to name Carroll, in memory of Commander Reid Wiseman's late wife. It is about 5.6 km across, on the western edge of the near side."
    alt:
      es: "Superficie lunar gris con un pequeño punto brillante en el centro, que es un cráter."
      en: "A gray lunar surface with a small bright spot at the center, which is a crater."
    sources:
      - https://images.nasa.gov/details/art002e012153
      - *record-release
    story:
      es: >-
        Durante el vuelo, la tripulación propuso poner nombre a dos cráteres de la Luna. Uno es Integrity, por su nave.
        El otro es Carroll, en honor de la esposa de Reid Wiseman, fallecida. Tiene unos 5,6 kilómetros de diámetro,
        está en el borde occidental de la cara visible y podría verse desde la Tierra con telescopios potentes. Son
        propuestas: NASA ha indicado que, al terminar la misión, se enviarán a la Unión Astronómica Internacional,
        la organización que regula los nombres de los cuerpos celestes y de sus accidentes.
      en: >-
        During the flight the crew proposed names for two craters on the Moon. One is Integrity, after their
        spacecraft. The other is Carroll, in honor of Reid Wiseman's late wife. It is about 5.6 kilometers across, on
        the western edge of the near side, and would be visible from Earth with powerful telescopes. These are
        proposals: NASA said that after the mission they would be submitted to the International Astronomical Union,
        the organization that governs the naming of celestial bodies and their surface features.
      sources:
        - https://images.nasa.gov/details/art002e012153
        - *record-release

  - nasaId: art002e009279
    chapter: far-side
    title:
      es: "Dos cráteres con nombre propuesto"
      en: "Two proposed names"
    caption:
      es: "Los anillos de Orientale, fotografiados a las 15:41 (hora del este de EE. UU.) del 6 de abril de 2026. En la posición de las diez en punto de la cuenca se ven los dos cráteres que la tripulación propuso llamar Integrity y Carroll."
      en: "The rings of Orientale, photographed at 3:41 p.m. EDT on 6 April 2026. At the 10 o'clock position of the basin are the two craters the crew proposed to name Integrity and Carroll."
    alt:
      es: "Los anillos concéntricos de una gran cuenca lunar, con dos pequeños cráteres cerca de su borde."
      en: "The concentric rings of a large lunar basin, with two small craters near its edge."
    sources:
      - https://images.nasa.gov/details/art002e009279

  - nasaId: art002e009284
    chapter: far-side
    title:
      es: "La Tierra, pequeña junto a la Luna"
      en: "A small Earth beside the Moon"
    caption:
      es: "La Tierra, en fase creciente, asoma tras el borde de la Luna, 36 minutos antes del ocaso terrestre visto desde Orion. El fondo oscuro de Orientale ocupa casi un tercio inferior de la superficie."
      en: "Earth, in a crescent phase, appears beyond the edge of the Moon, 36 minutes before Earthset as seen from Orion. The dark floor of Orientale covers nearly the lower third of the surface."
    alt:
      es: "La Luna ocupa casi toda la imagen y, tras su borde, se ve la Tierra como un pequeño creciente."
      en: "The Moon fills most of the frame and, beyond its edge, Earth is a small crescent."
    sources:
      - https://images.nasa.gov/details/art002e009284

  - nasaId: art002e021278
    chapter: far-side
    title:
      es: "Ocaso de la Tierra desde Orion"
      en: "Earthset from Orion"
    caption:
      es: "Al pasar por detrás de la Luna durante el sobrevuelo, la tripulación fotografió la Tierra ocultándose tras el horizonte lunar, una imagen que evoca el famoso Earthrise de la tripulación del Apolo 8 en 1968."
      en: "Passing behind the Moon during the flyby, the crew photographed Earth setting beyond the lunar horizon, an image that echoes the famous Apollo 8 Earthrise of 1968."
    alt:
      es: "La Tierra, parcialmente iluminada, sobre el horizonte gris de la Luna."
      en: "Earth, partly lit, above the gray horizon of the Moon."
    sources:
      - https://images.nasa.gov/details/art002e021278
      - *recap
    story:
      es: >-
        El 6 de abril de 2026, al pasar por detrás de la Luna, la tripulación vio ocultarse la Tierra tras el
        horizonte lunar, y la fotografió. NASA relaciona la imagen con el famoso Earthrise que captaron los
        astronautas del Apolo 8 en 1968. No es la misma escena: una cámara montada en un panel solar de Orion
        registró también un fino creciente de la Tierra que asomaba tras la Luna, a las 19:22, hora del este de
        EE. UU. Más de medio siglo separa esta imagen de la del Apolo 8.
      en: >-
        On 6 April 2026, passing behind the Moon, the crew watched Earth set beyond the lunar horizon and
        photographed it. NASA links the image to the famous Earthrise that the Apollo 8 astronauts captured in 1968.
        It is not the same scene: a camera mounted on one of Orion's solar array wings also recorded a thin
        crescent of Earth tucked behind the Moon, at 7:22 p.m. EDT. More than half a century separates this image from the one
        taken by Apollo 8.
      sources:
        - https://images.nasa.gov/details/art002e021278
        - https://images.nasa.gov/details/art002e016299
        - https://images.nasa.gov/details/art002e009284
        - *recap

  - nasaId: art002e016299
    chapter: far-side
    title:
      es: "La Tierra vista por una cámara de Orion"
      en: "Earth through an Orion camera"
    caption:
      es: "Una cámara montada en uno de los paneles solares de Orion captó un fino creciente de la Tierra a las 19:22 (hora del este de EE. UU.) durante el sobrevuelo del lado oculto de la Luna. NASA no indica quién disparó; es una cámara exterior de la nave."
      en: "A camera mounted on one of Orion's solar array wings captured a thin crescent of Earth at 7:22 p.m. EDT during the flyby of the Moon's far side. It is an exterior spacecraft camera, not a handheld photo."
    alt:
      es: "Un delgado creciente de la Tierra, medio oculto en la sombra y medio tras el borde de la Luna, en la esquina inferior derecha."
      en: "A thin crescent of Earth, partly in shadow and partly tucked behind the edge of the Moon in the lower right corner."
    sources:
      - https://images.nasa.gov/details/art002e016299
      - https://www.nasa.gov/image-detail/amf-art002e016299/

  - nasaId: art002e009296
    chapter: far-side
    title:
      es: "Los cuatro, juntos"
      en: "All four together"
    caption:
      es: "A mitad del periodo de observación lunar, Reid Wiseman, Victor Glover, Christina Koch y Jeremy Hansen hacen una pausa para tomarse un autorretrato dentro de Orion."
      en: "Midway through the lunar observation period, Reid Wiseman, Victor Glover, Christina Koch and Jeremy Hansen pause for a selfie inside Orion."
    alt:
      es: "Los cuatro astronautas juntos dentro de la cabina de la nave, en un autorretrato."
      en: "The four astronauts together inside the spacecraft cabin, in a self-portrait."
    sources:
      - https://images.nasa.gov/details/art002e009296

  - nasaId: art002e014251
    chapter: far-side
    title:
      es: "Trabajo en la penumbra de la cabina"
      en: "Working in the dark cabin"
    caption:
      es: "Jeremy Hansen, de la Agencia Espacial Canadiense, toma fotografías por la ventana de Orion durante el sobrevuelo. La tripulación pasó unas siete horas por turnos en las ventanas para recoger datos científicos."
      en: "Jeremy Hansen of the Canadian Space Agency takes images through Orion's window during the lunar flyby. The crew spent about seven hours taking turns at the windows to collect science data."
    alt:
      es: "Un astronauta junto a una ventana en una cabina a oscuras, con una pantalla encendida cerca."
      en: "An astronaut at a window in a darkened cabin, with a lit screen nearby."
    sources:
      - https://images.nasa.gov/details/art002e014251
    story:
      es: >-
        Durante el sobrevuelo del 6 de abril de 2026, la tripulación pasó unas siete horas por turnos en las ventanas
        de Orion recogiendo datos científicos para el equipo en la Tierra. En el punto más cercano, estuvo a 4.067
        millas (unos 6.545 km) de la superficie lunar. Los dispositivos de la cabina ejecutaban el Plan de Puntería
        Lunar, un programa hecho a medida por el equipo de observaciones lunares de la tripulación, parte del equipo
        científico de Artemis II, que guiaba la ejecución del plan de observación. NASA explica que los ojos y el
        cerebro humanos detectan matices de color y textura que pueden aportar descubrimientos y una comprensión más
        fina de la superficie lunar. Fue un trabajo en equipo, repartido en turnos.
      en: >-
        During the 6 April 2026 flyby, the crew spent about seven hours taking turns at Orion's windows, collecting
        science data for the team on Earth. At closest approach they came within 4,067 miles (about 6,545 km) of the
        lunar surface. Devices in the cabin ran the Lunar Targeting Plan, custom software built by the crew lunar
        observations team, a subset of the Artemis II lunar science team, to guide the observation plan. NASA explains
        that human eyes and brains are sensitive to subtle changes in color and texture, which may uncover new
        discoveries and a more nuanced appreciation of the lunar surface. It was teamwork, shared in shifts.
      sources:
        - https://images.nasa.gov/details/art002e014251
        - *faq

  # ---- Eclipse (display order: 19, 18, 17, 20 in CURATION.md) ----
  - nasaId: art002e010782
    chapter: eclipse
    title:
      es: "Empieza el eclipse"
      en: "The eclipse begins"
    caption:
      es: "Una cuña de Luna en plena noche ocupa el primer plano mientras el Sol se oculta tras ella. Desde Orion, mucho más cerca de la Luna que cualquier observador en la Tierra, el Sol tardó casi una hora en pasar tras el disco lunar. Los rayos que salen hacia abajo son parte de la corona solar."
      en: "A wedge of the Moon in night fills the foreground as the Sun sets behind it. From Orion, much nearer the Moon than any observer on Earth, the Sun took nearly an hour to pass behind the lunar disk. The rays running outward toward the bottom are part of the Sun's corona."
    alt:
      es: "Un fragmento oscuro de la Luna con un borde dentado, y rayos de luz tenue que se extienden hacia abajo desde el lugar donde se oculta el Sol."
      en: "A dark piece of the Moon with a jagged edge, and faint rays of light extending downward from where the Sun is hiding."
    sources:
      - https://images.nasa.gov/details/art002e010782

  - nasaId: art002e009301
    chapter: eclipse
    title:
      es: "Un eclipse total desde el espacio profundo"
      en: "A total eclipse from deep space"
    caption:
      es: "La Luna oculta por completo al Sol. Desde la nave, la totalidad duró casi 54 minutos, mucho más de lo posible desde la Tierra. Alrededor del disco oscuro hay un halo; los científicos estudian si procede de la corona solar, de la luz zodiacal o de ambas. También se ven estrellas."
      en: "The Moon fully covers the Sun. From the spacecraft, totality lasted nearly 54 minutes, far longer than is possible from Earth. A halo glows around the dark disk; scientists are investigating whether it comes from the solar corona, zodiacal light or both. Stars are visible too."
    alt:
      es: "Un disco oscuro rodeado de un halo luminoso sobre un fondo negro con estrellas."
      en: "A dark disk surrounded by a luminous halo on a black background with stars."
    sources:
      - https://images.nasa.gov/details/art002e009301
    story:
      es: >-
        Desde la Tierra, un eclipse total dura unos minutos, porque el Sol y la Luna tienen un tamaño aparente
        parecido. Desde Orion, el 6 de abril de 2026, la Luna estaba tan cerca que se veía mucho mayor que el Sol,
        y la totalidad duró casi una hora. La tripulación usó gafas de eclipse iguales a las que NASA produjo para
        los eclipses de 2023 y 2024; fue la primera vez que se usaron en la Luna. Alrededor del disco lunar se ve un
        halo, y los científicos investigan si es corona solar, luz zodiacal o una mezcla. Una cámara en un panel
        solar de Orion lo registró desde fuera, con Venus a un lado de la Luna y Saturno al otro.
      en: >-
        From Earth, a total eclipse lasts minutes, because the Sun and the Moon look about the same size. From
        Orion on 6 April 2026 the Moon was so close that it appeared much larger than the Sun, and totality lasted
        nearly an hour. The crew wore eclipse viewers identical to those NASA made for the 2023 and 2024 eclipses,
        the first use of eclipse glasses at the Moon. A halo glows around the lunar disk, and scientists are
        investigating whether it is solar corona, zodiacal light or a mix. A camera on one of Orion's solar array
        wings recorded it from outside, with Venus on one side of the Moon and Saturn on the other.
      sources:
        - https://images.nasa.gov/details/art002e009301
        - https://images.nasa.gov/details/art002e010782
        - https://images.nasa.gov/details/art002e016324
        - *recap

  - nasaId: art002e016324
    chapter: eclipse
    title:
      es: "El eclipse visto desde fuera de la nave"
      en: "The eclipse from outside the spacecraft"
    caption:
      es: "Una cámara montada en uno de los paneles solares de Orion registró el eclipse durante el sobrevuelo. Venus se ve a la izquierda de la Luna y Saturno a la derecha; los científicos estudian si el resplandor es luz zodiacal, corona solar o ambas."
      en: "A camera mounted on one of Orion's solar array wings recorded the eclipse during the flyby. Venus can be spotted to the left of the Moon and Saturn to the right; scientists are investigating whether the glow is zodiacal light, the solar corona or both."
    alt:
      es: "La Luna oscura con un resplandor a su alrededor y dos puntos brillantes, uno a cada lado."
      en: "The dark Moon with a glow around it and two bright points, one on each side."
    sources:
      - https://images.nasa.gov/details/art002e016324

  - nasaId: art002e009575
    chapter: eclipse
    title:
      es: "Vuelve la luz"
      en: "Sunlight returns"
    caption:
      es: "El Sol reaparece por el borde izquierdo de la Luna y termina un eclipse total de casi una hora, el 6 de abril de 2026. Orion aparece en primer plano."
      en: "The Sun rises at the left edge of the Moon, ending a total solar eclipse of nearly an hour on 6 April 2026. Orion is in the foreground."
    alt:
      es: "El borde de la Luna con un punto de luz solar en su lado izquierdo y parte de la nave en primer plano."
      en: "The edge of the Moon with a point of sunlight on its left side and part of the spacecraft in the foreground."
    sources:
      - https://images.nasa.gov/details/art002e009575

  # ---- Return (display order: 26, 21, 22, 23, 24, 25 in CURATION.md) ----
  - nasaId: art002e012588
    chapter: return
    title:
      es: "Estrellas de la Vía Láctea"
      en: "Stars of the Milky Way"
    caption:
      es: "La tripulación fotografió la Vía Láctea durante el viaje de regreso. Nuestra galaxia mide más de 100.000 años luz de ancho y la Tierra está en uno de sus brazos, a media distancia del centro."
      en: "The crew photographed the Milky Way on the way home. Our galaxy spans more than 100,000 light-years, and Earth lies along one of its spiral arms, about halfway from the center."
    alt:
      es: "Un campo denso de estrellas sobre un fondo oscuro."
      en: "A dense field of stars on a dark background."
    sources:
      - https://images.nasa.gov/details/art002e012588
      - https://www.nasa.gov/gallery/return-to-earth/

  - nasaId: art002e025219
    chapter: return
    title:
      es: "Con la Tierra a la espalda"
      en: "With Earth behind"
    caption:
      es: "Victor Glover dentro de Orion, con la Tierra en cuarto creciente tras la ventana. La foto es posterior al sobrevuelo, cuando la tripulación ya volvía a casa."
      en: "Victor Glover inside Orion, with the crescent Earth through the window behind him. The picture was taken after the lunar flyby, on the way back to Earth."
    alt:
      es: "Un astronauta dentro de la cabina, con un creciente de la Tierra visible por la ventana tras él."
      en: "An astronaut inside the cabin, with a crescent of Earth visible through the window behind him."
    sources:
      - https://images.nasa.gov/details/art002e025219

  - nasaId: art002e041711
    chapter: return
    title:
      es: "Una Tierra y una tripulación que sonríen"
      en: "Smiling Earth, smiling crew"
    caption:
      es: "Christina Koch dentro de Orion, con la Tierra en cuarto creciente tras la ventana. La foto es posterior al sobrevuelo, durante el regreso."
      en: "Christina Koch inside Orion, with the crescent Earth through the window behind her. The picture was taken after the lunar flyby, on the return leg."
    alt:
      es: "Una astronauta dentro de la cabina, con un creciente de la Tierra visible por la ventana tras ella."
      en: "An astronaut inside the cabin, with a crescent of Earth visible through the window behind her."
    sources:

  - nasaId: "art002e021278"
    mediaFolder: "art002e021278"
    curationRef: "Mission 11"
    chapter: "far-side"
    displayOrder: 8
    date: "2026-04-06"
    camera: null
    credit: "NASA"
    originalUrl: "https://images-assets.nasa.gov/image/art002e021278/art002e021278~orig.jpg"
    title:
      es: "Puesta de la Tierra tras el horizonte de la Luna"
      en: "Earthset behind the lunar horizon"
    caption:
      es: "La Tierra se oculta tras el horizonte gris de la Luna el 6 de abril de 2026 mientras Orion pasa detrás del lado oculto durante el sobrevuelo de siete horas, en una imagen que el registro de NASA compara con la histórica salida de la Tierra fotografiada por Apolo 8 en 1968."
      en: "Earth sinks behind the Moon's grey horizon on April 6, 2026, as Orion passes behind the lunar far side during the seven-hour flyby, in a frame that NASA's record compares to the iconic Earthrise photographed by the Apollo 8 crew in 1968."
    alt:
      es: "La mitad de la creciente azul y blanca de la Tierra asomando por encima del horizonte gris y lleno de cráteres de la Luna bajo un cielo negro."
      en: "Half of Earth's blue-and-white crescent peeking above the grey, cratered horizon of the Moon against a black sky."
    story:
      es: >-
        Treinta y seis minutos antes de la puesta de la Tierra el 6 de abril de 2026, el planeta aún flotaba como una uña azul y blanca por encima del limbo lunar. A las 6:41 p. m. EDT, a medida que la trayectoria de Orion se curvaba hacia el lado oculto, la tripulación vio cómo nuestro mundo se hundía lentamente tras las montañas grises de la Luna: una puesta de la Tierra que el archivo de NASA vincula con el recuerdo visual de la salida de la Tierra captada por Apolo 8 en 1968. Tres minutos después, a las 6:44 p. m. EDT, la Luna bloqueó las señales de radio con la Tierra durante 41 minutos. Hacia el final de ese paso por detrás del lado oculto, a las 7:22 p. m. EDT —tres minutos antes de restablecerse el contacto por radio a las 7:25 p. m. EDT—, una cámara exterior instalada en un panel solar de Orion registró el instante inverso: la delgada silueta de la Tierra asomando de nuevo junto al borde oscuro de la Luna.
      en: >-
        Thirty-six minutes before Earthset on April 6, 2026, our planet still hung like a blue-and-white fingernail above the lunar limb. At 6:41 p.m. EDT, as Orion's trajectory curved toward the far side, the crew watched home slip behind the Moon's grey highlands—an Earthset that NASA's catalog links to the visual legacy of the 1968 Apollo 8 Earthrise. Three minutes later, at 6:44 p.m. EDT, the Moon blocked radio signals with Earth for a planned 41-minute communications blackout. Near the end of that pass behind the Moon, at 7:22 p.m. EDT—three minutes before radio contact was reacquired at 7:25 p.m. EDT—an exterior camera mounted on one of Orion's solar array wings recorded the reverse moment: a delicate sliver of Earth rising once more beside the lunar edge.
      facts:
        - id: "story-farside-11-earthset-earthrise-sequence"
          claim:
            es: "El 6 de abril de 2026, la tripulación fotografió la Tierra 36 minutos antes de ocultarse (art002e009284) y luego la puesta de la Tierra a las 6:41 p. m. EDT al pasar hacia el lado oculto (art002e021278, comparada en el registro de NASA con la foto de Apolo 8 de 1968); Orion voló en silencio de radio de las 6:44 a las 7:25 p. m. EDT, y a las 7:22 p. m. ET una cámara en un panel solar de Orion captó la salida de la Tierra (art002e016299) antes de recuperarse la señal."
            en: "On April 6, 2026, the crew photographed Earth 36 minutes before setting (art002e009284) and then Earthset at 6:41 p.m. EDT as Orion curved behind the far side (art002e021278, which NASA's record compares to the 1968 Apollo 8 Earthrise); Orion flew in radio blackout from 6:44 to 7:25 p.m. EDT, and at 7:22 p.m. ET a solar-array-wing camera captured Earthrise (art002e016299) shortly before signal reacquisition."
          sources:
            - title: "NASA Image and Video Library: art002e009284"
              url: "https://images.nasa.gov/details/art002e009284"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: art002e021278"
              url: "https://images.nasa.gov/details/art002e021278"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: art002e016299"
              url: "https://images.nasa.gov/details/art002e016299"
              accessed: "2026-10-20"
            - title: "NASA Blog: Artemis II Flight Day 6 — Lunar Flyby Updates (April 6, 2026)"
              url: "https://www.nasa.gov/blogs/missions/2026/04/06/artemis-ii-flight-day-6-lunar-flyby-updates/"
              accessed: "2026-10-21"
    facts:
      - id: "photo-farside-11-earthset-apollo8"
        claim:
          es: "La tripulación de Artemis II capturó esta imagen de la puesta de la Tierra el 6 de abril de 2026 durante el sobrevuelo de siete horas al pasar detrás del lado oculto; el registro de NASA señala su paralelismo con la fotografía de la salida de la Tierra de Apolo 8 en 1968."
          en: "The Artemis II crew captured this Earthset image on April 6, 2026, during the seven-hour lunar flyby as Orion passed behind the far side; NASA's record notes its echo of the 1968 Apollo 8 Earthrise photograph."
        sources:
          - title: "NASA Image and Video Library: art002e021278"
            url: "https://images.nasa.gov/details/art002e021278"
            accessed: "2026-10-20"


      en: "A close view of Earth's curved edge, with bright cloud bands against the dark background of space."
    sources:
      - https://images.nasa.gov/details/art002e023575

  - nasaId: art002e009007
    chapter: outbound
    title:
      es: "Mirando atrás"
      en: "Looking back"
    caption:
      es: "El comandante Reid Wiseman mira por una de las ventanas principales de la cabina de Orion hacia la Tierra, mientras la tripulación viaja hacia la Luna. NASA no indica quién tomó la foto."
      en: "Commander Reid Wiseman looks out of one of Orion's main cabin windows at Earth as the crew travels toward the Moon. NASA does not name the photographer."
    alt:
      es: "Un astronauta asomado a una ventana de la cabina de la nave, con la Tierra al otro lado del cristal."

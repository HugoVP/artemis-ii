      en: "A camera mounted on one of Orion's solar array wings captured this view of the eclipse on April 6, 2026, with the spacecraft in the foreground and the Moon hiding the Sun for nearly an hour. Flanking the glow around the lunar disk are the planet Venus on the left and Saturn on the right."

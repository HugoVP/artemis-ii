  - nasaId: KSC-20260410-PH-JNV01_0001
    chapter: return
    title:
      es: "Descenso bajo los paracaídas"
      en: "Descent under parachutes"
    caption:
      es: "Los paracaídas de Orion se despliegan antes del amerizaje en el océano Pacífico, cerca de San Diego, el 10 de abril de 2026. Foto: NASA/Josh Valcarcel."
      en: "Orion's parachutes deploy before splashdown in the Pacific Ocean near San Diego on 10 April 2026. Photo: NASA/Josh Valcarcel."
    alt:
      es: "La cápsula Orion colgada de varios paracaídas abiertos sobre el cielo."
      en: "The Orion capsule hanging from several open parachutes in the sky."
    sources:
      - https://images.nasa.gov/details/KSC-20260410-PH-JNV01_0001
    story:
      es: >-
        El 10 de abril de 2026, tras casi diez días de misión, Orion descendió bajo sus paracaídas y amerizó en el
        Pacífico, frente a San Diego, a las 17:07 hora del Pacífico (20:07, hora del este de EE. UU.). Equipos de
        NASA y de la Armada de EE. UU. se acercaron en balsas, ayudaron a la tripulación a salir de la nave y la
        trasladaron en helicóptero al buque USS John P. Murtha. Orion también subió al buque para volver a tierra.
        El regreso fue obra de muchas personas, en el agua, en el aire y en el centro de control.
      en: >-
        On 10 April 2026, after almost ten days of mission, Orion descended under its parachutes and splashed down in
        the Pacific off San Diego at 5:07 p.m. PDT (8:07 p.m. EDT). NASA and U.S. Navy teams approached in rafts,
        helped the crew out of the spacecraft and flew them by helicopter to the USS John P. Murtha. Orion was also
        brought aboard the ship for the trip back to shore. The return was the work of many people, in the water, in
        the air and in mission control.
      sources:
        - https://images.nasa.gov/details/KSC-20260410-PH-JNV01_0001
        - https://images.nasa.gov/details/KSC-20260411-KED01-0332
        - *reentry
        - *recap


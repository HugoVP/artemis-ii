  - nasaId: "art002e012153"
    mediaFolder: "art002e012153"
    curationRef: "Mission 13"
    chapter: "far-side"
    displayOrder: 5
    date: "2026-04-06"
    camera: null
    credit: "NASA"
    originalUrl: "https://images-assets.nasa.gov/image/art002e012153/art002e012153~orig.jpg"
    title:
      es: "El cráter propuesto con el nombre de Carroll"
      en: "The crater proposed as Carroll"
    caption:
      es: "El pequeño punto brillante en el centro de esta imagen del 6 de abril de 2026 es un cráter de unas 3,5 millas (5,6 kilómetros) de diámetro situado en el extremo occidental de la cara visible, junto a la cuenca Orientale, para el cual la tripulación de Artemis II propuso el nombre de Carroll en recuerdo de la difunta esposa del comandante Reid Wiseman."
      en: "The small bright spot at the center of this April 6, 2026 photograph is a crater about 3.5 miles (5.6 kilometers) in diameter on the western edge of the lunar near side near the Orientale basin, which the Artemis II crew proposed naming Carroll in remembrance of Commander Reid Wiseman's late wife."
    alt:
      es: "Vista cercana del terreno lunar rugoso con un pequeño cráter circular de bordes muy brillantes en el centro del encuadre."
      en: "Close view of rugged lunar terrain featuring a small circular crater with bright rim ejecta at the center of the frame."
    story:
      es: >-
        En la posición de las diez en punto respecto de la cuenca Orientale, sobre el borde occidental de la cara visible de la Luna, destacan dos pequeños cráteres que la tripulación de Artemis II fotografió durante su turno de observación del 6 de abril de 2026. Los cuatro astronautas propusieron llamarlos Integrity —como llamaron a su nave Orion— y Carroll, en memoria de la difunta esposa del comandante Reid Wiseman. Con unas 3,5 millas (5,6 kilómetros) de diámetro, el cráter propuesto como Carroll se encuentra justo dentro del hemisferio orientado hacia la Tierra, de modo que puede localizarse desde nuestro planeta con telescopios potentes.
      en: >-
        Near the ten o'clock position of the Orientale basin, along the western edge of the Moon's near side, lie two small craters that the Artemis II crew photographed during their April 6, 2026 observation shift. The four astronauts proposed naming them Integrity—sharing the name they gave their Orion spacecraft—and Carroll, in remembrance of Commander Reid Wiseman's late wife. Measuring about 3.5 miles (5.6 kilometers) across, the crew-proposed Carroll crater sits just inside the Earth-facing hemisphere, where it can be spotted from Earth through powerful telescopes.
      facts:
        - id: "story-farside-13-proposed-craters"
          claim:
            es: "La tripulación de Artemis II propuso los nombres Integrity (como su nave Orion) y Carroll (en recuerdo de la difunta esposa de Reid Wiseman) para dos pequeños cráteres situados en la posición de las 10 en punto de la cuenca Orientale; el cráter propuesto como Carroll mide unas 3,5 millas (5,6 km) de diámetro, está en el borde occidental de la cara visible y es observable desde la Tierra con telescopios potentes."
            en: "The Artemis II crew proposed the names Integrity (after their Orion spacecraft) and Carroll (in remembrance of Reid Wiseman's late wife) for two small craters at the 10 o'clock position of the Orientale basin; the proposed Carroll crater is about 3.5 miles (5.6 km) across on the western edge of the near side and is visible from Earth with powerful telescopes."
          sources:
            - title: "NASA Image and Video Library: art002e012153"
              url: "https://images.nasa.gov/details/art002e012153"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: art002e009279"
              url: "https://images.nasa.gov/details/art002e009279"
              accessed: "2026-10-20"
            - title: "NASA Curious Universe Podcast Transcript: Artemis II Crew Flies Around the Moon"
              url: "https://www.nasa.gov/podcasts/curious-universe/artemis-ii-circles-moon/"
              accessed: "2026-10-20"
    facts:
      - id: "photo-farside-13-carroll-details"
        claim:
          es: "El cráter propuesto por la tripulación como Carroll (en memoria de la difunta esposa del comandante Reid Wiseman) mide unas 3,5 millas (5,6 km) de diámetro y se ubica en el borde occidental de la cara visible de la Luna."
          en: "The crater proposed by the crew as Carroll (after Commander Reid Wiseman's late wife) is about 3.5 miles (5.6 km) in diameter and lies on the western edge of the lunar near side."
        sources:
          - title: "NASA Image and Video Library: art002e012153"
            url: "https://images.nasa.gov/details/art002e012153"
            accessed: "2026-10-20"


  - nasaId: "art002e009301"
    mediaFolder: "art002e009301"
    curationRef: "Mission 18"
    chapter: "eclipse"
    displayOrder: 2
    date: "2026-04-06"
    camera: null
    credit: "NASA"
    originalUrl: "https://images-assets.nasa.gov/image/art002e009301/art002e009301~orig.jpg"
    title:
      es: "Totalidad del eclipse solar vista desde Orion"
      en: "Total solar eclipse seen from Orion"
    caption:
      es: "Fotografiada por la tripulación el 6 de abril de 2026, la Luna oculta por completo al Sol durante un eclipse que alcanzó casi 54 minutos de totalidad desde la perspectiva de Orion. Alrededor del disco lunar brilla un halo cuya combinación de corona solar y luz zodiacal es objeto de estudio científico, mientras el reflejo de la Tierra ilumina tenuemente la superficie lunar y permite distinguir estrellas de fondo."
      en: "Photographed by the crew on April 6, 2026, the Moon completely blocks the Sun during an eclipse that produced nearly 54 minutes of totality from Orion's vantage point. A bright halo surrounds the dark lunar disk—investigated by scientists as a combination of solar corona and zodiacal light—while faint Earthshine illuminates the lunar surface and background stars become visible."
    alt:
      es: "El disco oscuro de la Luna en el centro del encuadre rodeado por un halo luminoso blanco en medio de un cielo estrellado."
      en: "The dark circular disk of the Moon centered in the frame, surrounded by a glowing white halo against a starry black sky."
    story:
      es: >-
        Visto desde la Tierra, un eclipse solar total dura apenas unos minutos porque el Sol y la Luna aparentan casi el mismo tamaño en el cielo. El 6 de abril de 2026, en cambio, la tripulación de Artemis II se encontraba tan cerca de la Luna que su disco oscuro superaba ampliamente al del Sol, regalándoles casi 54 minutos de totalidad entre las 8:35 y las 9:32 p. m. EDT. Mientras las fotografías del inicio del eclipse mostraban con claridad las corrientes de la corona solar tras las montañas del limbo, las tomas de totalidad de gran campo revelaron un resplandor más amplio acompañado por los planetas Venus y Saturno; el informe científico preliminar del 7 de octubre de 2026 distingue en ese brillo tanto estructuras coronales como el cono de luz zodiacal producido por el polvo interplanetario.
      en: >-
        Seen from Earth, a total solar eclipse lasts only a few minutes because the Moon and Sun appear nearly the same size in our sky. On April 6, 2026, however, the Artemis II crew flew close enough to the Moon that its disk loomed far larger than the Sun, creating nearly 54 minutes of totality between 8:35 and 9:32 p.m. EDT. While close-in frames at eclipse onset clearly resolved streamers of the Sun's outer corona above backlit mountains, wider totality images revealed a broader luminous halo flanked by the planets Venus and Saturn; the October 7, 2026 preliminary lunar science report distinguishes both coronal structures and zodiacal light—sunlight scattered by interplanetary dust—within these observations.
      facts:
        - id: "story-eclipse-18-totality-and-light"
          claim:
            es: "El eclipse solar del 6 de abril de 2026 ofreció casi 54 minutos de totalidad desde Orion (entre las 8:35 y las 9:32 p. m. EDT); los registros y el informe preliminar del 7 de octubre de 2026 distinguen las corrientes de la corona solar (visibles en art002e010782) de la luz zodiacal y el halo amplio donde también aparecen Venus y Saturno (art002e009301, art002e016324)."
            en: "The April 6, 2026 solar eclipse produced nearly 54 minutes of totality from Orion (between 8:35 and 9:32 p.m. EDT); the photo records and the October 7, 2026 preliminary science report distinguish solar coronal streamers (seen in art002e010782) from zodiacal light and the broad halo accompanied by Venus and Saturn (art002e009301, art002e016324)."
          sources:
            - title: "NASA Image and Video Library: art002e009301"
              url: "https://images.nasa.gov/details/art002e009301"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: art002e016324"
              url: "https://images.nasa.gov/details/art002e016324"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: art002e010782"
              url: "https://images.nasa.gov/details/art002e010782"
              accessed: "2026-10-20"
            - title: "Artemis II Preliminary Lunar Science Report (updated October 7, 2026)"
              url: "https://science.nasa.gov/feature/artemis-ii-preliminary-lunar-science-report/"
              accessed: "2026-10-20"
            - title: "NASA Blog: Artemis II Flight Day 6 — Lunar Flyby Updates (April 6, 2026)"
              url: "https://www.nasa.gov/blogs/missions/2026/04/06/artemis-ii-flight-day-6-lunar-flyby-updates/"
              accessed: "2026-10-21"
    facts:
      - id: "photo-eclipse-18-totality-details"
        claim:
          es: "La imagen art002e009301 del 6 de abril de 2026 muestra la Luna eclipsando por completo al Sol durante casi 54 minutos de totalidad, con un halo luminoso (investigado como corona solar, luz zodiacal o ambos), estrellas visibles y el brillo tenue de la luz reflejada por la Tierra sobre la Luna."
          en: "Image art002e009301 from April 6, 2026, shows the Moon fully eclipsing the Sun during nearly 54 minutes of totality, with a glowing halo (investigated as corona, zodiacal light, or both), background stars, and faint Earthshine on the lunar surface."

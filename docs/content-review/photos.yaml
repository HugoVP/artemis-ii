      en: "NASA recovery team members and U.S. Navy personnel approach the Orion spacecraft by inflatable raft after splashdown at 5:07 p.m. PDT on 10 April 2026. Photo: NASA/Kevin Davis."
    alt:
      es: "La cápsula Orion flotando en el mar, con bolsas naranjas inflables, y una balsa con personas que se acerca."

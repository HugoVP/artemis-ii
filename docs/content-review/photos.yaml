  - nasaId: "KSC-20260410-PH-JNV01_0001"
    mediaFolder: "KSC-20260410-PH-JNV01_0001"
    curationRef: "Mission 23"
    chapter: "return"
    displayOrder: 4
    date: "2026-04-10"
    camera: null
    credit: "NASA/Josh Valcarcel"
    originalUrl: "https://images-assets.nasa.gov/image/KSC-20260410-PH-JNV01_0001/KSC-20260410-PH-JNV01_0001~orig.jpg"
    title:
      es: "Orion desciende bajo sus tres paracaídas principales sobre el Pacífico"
      en: "Orion descends under its three main parachutes over the Pacific"
    caption:
      es: "El módulo de tripulación de Orion desciende suspendido de sus tres paracaídas principales sobre el océano Pacífico, frente a la costa de San Diego, California, el viernes 10 de abril de 2026, momentos antes de tocar el agua al término de los diez días de la misión Artemis II."
      en: "The Orion crew module descends under its three main parachutes toward the Pacific Ocean near San Diego, California, on Friday, April 10, 2026, moments before splashdown at the conclusion of the ten-day Artemis II test flight."
    alt:
      es: "La cápsula Orion colgando de tres grandes paracaídas naranjas y blancos completamente abiertos en un cielo claro sobre el océano."
      en: "The Orion capsule suspended beneath three large orange-and-white main parachutes fully deployed in a clear sky above the ocean."
    story:
      es: >-
        Después de fotografiar la Vía Láctea a 200.000 millas náuticas y ver crecer día tras día la creciente azul de la Tierra por las ventanillas, el viaje de diez días de Artemis II llegó a su prueba final en la tarde del viernes 10 de abril de 2026. Tras separarse del módulo de servicio y atravesar la atmósfera a unas 35 veces la velocidad del sonido con su escudo térmico a cerca de 3.000 °F, la cápsula Integrity desplegó sus paracaídas de frenado y luego sus tres grandes paracaídas principales sobre el cielo de California. A las 8:07 p. m. EDT (5:07 p. m. PDT) amerizó frente a San Diego, donde las lanchas del equipo de aterrizaje y recuperación de NASA y el personal de la Marina de EE. UU. aseguraron la nave e izaron a Reid Wiseman, Victor Glover, Christina Koch y Jeremy Hansen hacia el buque anfibio USS John P. Murtha.
      en: >-
        After photographing the Milky Way 200,000 nautical miles out and watching Earth's blue crescent grow larger day by day in the cabin windows, Artemis II's ten-day journey reached its final test on the afternoon of Friday, April 10, 2026. Having separated from its service module and streaked through the atmosphere at roughly 35 times the speed of sound with heat-shield temperatures near 3,000 °F, the Integrity crew module deployed its drogues and three main parachutes over the California sky. At 8:07 p.m. EDT (5:07 p.m. PDT) the capsule splashed down off San Diego, where NASA's Landing and Recovery team and U.S. Navy personnel approached by raft to secure the spacecraft and bring Reid Wiseman, Victor Glover, Christina Koch, and Jeremy Hansen aboard the amphibious transport dock USS John P. Murtha.
      facts:
        - id: "story-return-23-splashdown-recovery"
          claim:
            es: "El viernes 10 de abril de 2026, tras reentrar a ~Mach 35 y ~3.000 °F, Orion descendió bajo tres paracaídas principales y amerizó en el océano Pacífico cerca de San Diego a las 5:07 p. m. PDT (8:07 p. m. EDT); el equipo de recuperación de NASA y personal de la Marina de EE. UU. asistieron a Wiseman, Glover, Koch y Hansen y los trasladaron al buque USS John P. Murtha."
            en: "On Friday, April 10, 2026, following re-entry at ~Mach 35 and ~3,000 °F, Orion descended under three main parachutes and splashed down in the Pacific Ocean near San Diego at 5:07 p.m. PDT (8:07 p.m. EDT); NASA's Landing and Recovery team and U.S. Navy personnel assisted Wiseman, Glover, Koch, and Hansen and brought them aboard USS John P. Murtha."
          sources:
            - title: "NASA Image and Video Library: KSC-20260410-PH-JNV01_0001"
              url: "https://images.nasa.gov/details/KSC-20260410-PH-JNV01_0001"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: KSC-20260411-KED01-0332"
              url: "https://images.nasa.gov/details/KSC-20260411-KED01-0332"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: NHQ202604100056"
              url: "https://images.nasa.gov/details/NHQ202604100056"
              accessed: "2026-10-20"
            - title: "NASA Blog: Artemis II Flight Day 10 — Re-entry Live Updates (April 10, 2026)"
              url: "https://www.nasa.gov/blogs/missions/2026/04/10/artemis-ii-flight-day-10-re-entry-live-updates/"
              accessed: "2026-10-21"
    facts:
      - id: "photo-return-23-parachutes"
        claim:
          es: "Los paracaídas de la nave Orion se desplegaron antes del amerizaje en el océano Pacífico cerca de San Diego, California, el viernes 10 de abril de 2026."
          en: "Parachutes secured to the Orion spacecraft deployed before splashdown in the Pacific Ocean near San Diego, California, on Friday, April 10, 2026."
        sources:
          - title: "NASA Image and Video Library: KSC-20260410-PH-JNV01_0001"
            url: "https://images.nasa.gov/details/KSC-20260410-PH-JNV01_0001"
            accessed: "2026-10-20"


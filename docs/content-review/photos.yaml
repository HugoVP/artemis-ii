  - nasaId: art002e004437
    chapter: outbound
    title:
      es: "Tierra en cuarto creciente"
      en: "A sliver of Earth"
    caption:
      es: "Solo un fino creciente de la Tierra recibe la luz del Sol en esta foto tomada por un tripulante a través de una ventana de Orion el tercer día de misión."
      en: "Only a thin crescent of Earth is lit by the Sun in this photo taken by a crew member through an Orion window on the third day of the mission."
    alt:
      es: "Un fino creciente luminoso de la Tierra sobre el negro del espacio."
      en: "A thin bright crescent of Earth against the black of space."
    sources:
      - https://images.nasa.gov/details/art002e004437

  - nasaId: art002e024097
    chapter: outbound
    title:
      es: "Antes de dormir, la Luna"
      en: "The Moon before sleep"
    caption:
      es: "Reid Wiseman mira por la ventana de Orion hacia la cara visible de la Luna antes de dormir, en el quinto día de vuelo, la noche previa al sobrevuelo."
      en: "Reid Wiseman looks out of Orion's window at the near side of the Moon before going to sleep on flight day 5, the night before the flyby."
    alt:
      es: "Un astronauta junto a una ventana de la nave mira hacia fuera, donde se ve la Luna."
      en: "An astronaut beside a spacecraft window looks outside, where the Moon is visible."
    sources:

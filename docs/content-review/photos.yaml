  - nasaId: "art002e012090"
    mediaFolder: "art002e012090"
    curationRef: "Mission 6"
    chapter: "far-side"
    displayOrder: 2
    date: "2026-04-06"
    camera: null
    credit: "NASA"
    originalUrl: "https://images-assets.nasa.gov/image/art002e012090/art002e012090~orig.jpg"
    title:
      es: "Los anillos concéntricos de la cuenca Orientale"
      en: "The concentric rings of the Orientale basin"
    caption:
      es: "Fotografía detallada obtenida por la tripulación de Artemis II el 6 de abril de 2026 durante el primer turno de observación del sobrevuelo lunar, en la que se aprecian las cordilleras anulares y el piso oscuro de lava de la cuenca Orientale, una de las estructuras de impacto grandes más jóvenes y mejor conservadas de la Luna."
      en: "Detailed photograph captured by the Artemis II crew on April 6, 2026, during the first shift of the lunar flyby observation period, showing the concentric mountain rings and dark basalt floor of the Orientale basin, one of the Moon's youngest and best-preserved large impact structures."
    alt:
      es: "Vista oblicua de la superficie lunar dominada por los anillos montañosos concéntricos y las manchas oscuras de lava solidificada del interior de la cuenca Orientale."
      en: "Oblique view of the lunar surface dominated by the concentric mountain rings and dark patches of solidified lava inside the Orientale basin."
    story:
      es: >-
        Desde la Tierra, la cuenca Orientale apenas se asoma de perfil en el borde occidental de la Luna. Desde la ventanilla de Orion el 6 de abril de 2026, en cambio, se abrió de frente como una diana geológica de casi 600 millas de diámetro y unos 3.700 millones de años de antigüedad. Sus cordilleras concéntricas —cuyo arco suroeste fue apodado informalmente «el beso» por los observadores de la era Apolo— conservan la huella del colosal impacto que excavó la corteza lunar y lanzó cadenas de cráteres secundarios a través de la vecina y más antigua cuenca Hertzsprung, hasta perderse junto a la línea quebrada del terminador donde los bordes de los cráteres emergían como islas en la noche.
      en: >-
        From Earth, the Orientale basin barely peeks around the Moon's western limb in foreshortened profile. Seen from Orion's windows on April 6, 2026, it opened head-on as a nearly 600-mile-wide, 3.7-billion-year-old geological bullseye. Its nested mountain rings—whose curving southwestern arc Apollo-era observers informally nicknamed "the kiss"—preserve the shockwave of a colossal impact that excavated the lunar crust and hurled chains of secondary craters across the neighboring, even older Hertzsprung basin, stretching toward the jagged day-night terminator where sunlit crater rims stood like islands in the dark.
      facts:
        - id: "story-farside-6-orientale-geology"
          claim:
            es: "La cuenca Orientale mide casi 600 millas de ancho y tiene unos 3.700 millones de años; sus cadenas de cráteres secundarios atraviesan la cuenca Hertzsprung (más antigua) hacia el terminador, y el arco suroeste de su anillo exterior recibió en la era Apolo el apodo informal de «el beso»."
            en: "The Orientale basin is nearly 600 miles wide and about 3.7 billion years old; its secondary crater chains scar the older Hertzsprung basin toward the terminator, and the southwestern arc of its outer ring was informally nicknamed 'the kiss' by Apollo-era observers."
          sources:
            - title: "NASA Image and Video Library: art002e012090"
              url: "https://images.nasa.gov/details/art002e012090"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: art002e009212"
              url: "https://images.nasa.gov/details/art002e009212"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: art002e010208"
              url: "https://images.nasa.gov/details/art002e010208"
              accessed: "2026-10-20"
            - title: "NASA Image and Video Library: art002e012273"
              url: "https://images.nasa.gov/details/art002e012273"
              accessed: "2026-10-20"
    facts:
      - id: "photo-farside-6-orientale-rings"
        claim:
          es: "La tripulación de Artemis II fotografió los anillos de la cuenca Orientale —una de las grandes cuencas de impacto más jóvenes y mejor conservadas de la Luna— durante el primer turno del periodo de observación del 6 de abril de 2026."
          en: "The Artemis II crew photographed the rings of the Orientale basin—one of the Moon's youngest and best-preserved large impact craters—during the first shift of the April 6, 2026 lunar flyby observation period."
        sources:
          - title: "NASA Image and Video Library: art002e012090"
            url: "https://images.nasa.gov/details/art002e012090"
            accessed: "2026-10-20"


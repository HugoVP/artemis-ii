  - nasaId: "art002e014251"
    mediaFolder: "art002e014251"
    curationRef: "Mission 16"
    chapter: "far-side"
    displayOrder: 11
    date: "2026-04-06"
    camera: null
    credit: "NASA"
    originalUrl: "https://images-assets.nasa.gov/image/art002e014251/art002e014251~orig.jpg"
    title:
      es: "Jeremy Hansen fotografiando la Luna desde la cabina en penumbra"
      en: "Jeremy Hansen photographing the Moon from the darkened cabin"
    caption:
      es: "El especialista de misión Jeremy Hansen (CSA) toma fotografías por una ventanilla de Orion el 6 de abril de 2026 con las luces de cabina apagadas para evitar reflejos en el cristal. Junto a la ventanilla brilla una tableta con el Lunar Targeting Plan, el programa desarrollado por el equipo científico de Artemis II para guiar las siete horas de observación a una distancia mínima de 4.067 millas de la Luna."
      en: "Mission Specialist Jeremy Hansen of the Canadian Space Agency (CSA) takes photographs through an Orion window on April 6, 2026, with cabin lights dimmed to prevent reflections on the glass. Beside the window glows a tablet running the Lunar Targeting Plan, custom software built by the Artemis II lunar science team to guide the seven hours of observations within 4,067 miles of the Moon."
    alt:
      es: "Interior oscuro de la cabina de Orion donde la silueta de un astronauta apunta una cámara hacia una ventanilla, iluminado por el brillo de una pantalla portátil cercana."
      en: "Dark interior of the Orion cabin where the silhouette of an astronaut aims a camera through a window, lit by the glow of a nearby tablet screen."
    story:
      es: >-
        Para fotografiar con nitidez el relieve lunar desde una cabina espacial hay que trabajar a oscuras: cualquier luz interior se reflejaría en el triple acristalamiento de las ventanillas de Orion. Durante unas siete horas el 6 de abril de 2026, mientras la nave pasaba hasta a 4.067 millas de la superficie, Reid Wiseman, Victor Glover, Christina Koch y Jeremy Hansen se turnaron frente a los cristales siguiendo el Lunar Targeting Plan, una aplicación creada por el equipo de observaciones lunares de Artemis II que sincronizaba cada objetivo geológico con los especialistas reunidos en la Sala de Evaluación Científica en Houston.
      en: >-
        Photographing crisp lunar detail from inside a spacecraft requires working in the dark: any cabin illumination would reflect off Orion's multi-pane windows. For roughly seven hours on April 6, 2026, as the spacecraft swept within 4,067 miles of the lunar surface, Reid Wiseman, Victor Glover, Christina Koch, and Jeremy Hansen rotated through window shifts guided by the Lunar Targeting Plan—custom software built by the Artemis II crew lunar observations team that coordinated every target with geologists in the Science Evaluation Room in Houston.
      facts:
        - id: "story-farside-16-science-operations"
          claim:
            es: "Durante unas siete horas el 6 de abril de 2026, con un acercamiento mínimo de 4.067 millas a la superficie lunar, Jeremy Hansen (CSA) y sus compañeros se turnaron en las ventanillas de Orion guiados por la aplicación Lunar Targeting Plan en coordinación con el equipo de ciencia lunar en la Tierra."
            en: "Over roughly seven hours on April 6, 2026, reaching within 4,067 miles of the lunar surface, Jeremy Hansen (CSA) and his crewmates took turns at Orion's windows guided by the custom Lunar Targeting Plan application in coordination with the lunar science team on Earth."
          sources:
            - title: "NASA Image and Video Library: art002e014251"
              url: "https://images.nasa.gov/details/art002e014251"
              accessed: "2026-10-20"
            - title: "Artemis II Preliminary Lunar Science Report (updated October 7, 2026)"
              url: "https://science.nasa.gov/feature/artemis-ii-preliminary-lunar-science-report/"
              accessed: "2026-10-20"
    facts:
      - id: "photo-farside-16-hansen-ltp"
        claim:
          es: "La imagen del 6 de abril de 2026 muestra al astronauta de la CSA Jeremy Hansen tomando fotografías desde la ventanilla de Orion durante las siete horas de observación lunar (a un mínimo de 4.067 millas de la Luna) junto a un dispositivo con el software Lunar Targeting Plan."
          en: "The April 6, 2026 image shows CSA astronaut Jeremy Hansen taking photographs through the Orion window during the seven-hour lunar flyby observation period (within 4,067 miles of the Moon) beside a device running the Lunar Targeting Plan software."
        sources:
          - title: "NASA Image and Video Library: art002e014251"
            url: "https://images.nasa.gov/details/art002e014251"
            accessed: "2026-10-20"
          - title: "Artemis II Preliminary Lunar Science Report (updated October 7, 2026)"

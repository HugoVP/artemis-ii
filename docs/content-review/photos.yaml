      en: "A fully illuminated view of the Moon taken on April 6, 2026, spanning both hemispheres: on the right lie the dark ancient lava plains of the Earth-facing near side; just west of them sits the nearly 600-mile-wide Orientale impact basin in full view; and to its left stretches the cratered terrain of the far side."

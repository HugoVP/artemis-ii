  - nasaId: KSC-20260210-PH-JBS01-0035
    chapter: launch
    title:
      es: "La sala blanca"
      en: "The White Room"
    caption:
      es: "Primer plano de la sala blanca, unida al brazo de acceso de la tripulación junto a la nave Orion, el 10 de febrero de 2026. Es el pequeño espacio de ambiente controlado donde los cuatro astronautas harían los últimos preparativos antes de subir a la nave."
      en: "A close view of the White Room, attached to the crew access arm beside the Orion spacecraft, on 10 February 2026. It is the small, environmentally controlled space where the four astronauts would make their final preparations before climbing into the spacecraft."
    alt:
      es: "La sala blanca conectada al brazo de acceso de la tripulación, junto a la nave Orion y su sistema de escape de lanzamiento, en lo alto del cohete."
      en: "The White Room connected to the crew access arm, next to the Orion spacecraft and its launch abort system, high on the rocket."
    sources:

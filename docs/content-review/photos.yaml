    originalUrl: "https://images-assets.nasa.gov/image/art002e010208/art002e010208~orig.jpg"
    title:
      es: "El terminador lunar y las cadenas de cráteres sobre Hertzsprung"
      en: "The lunar terminator and crater chains across Hertzsprung"
    caption:
      es: "Al sobrevolar el terminador —la frontera entre el día y la noche lunar, descrita por los astronautas como «cualquier cosa menos una línea recta»— el 6 de abril de 2026, los bordes de los cráteres destacan como islas iluminadas en la oscuridad. Las cadenas de cráteres expulsadas por la cuenca Orientale, de 3.700 millones de años, surcan el piso de la cuenca Hertzsprung en el centro de la imagen, demostrando que Hertzsprung es aún más antigua."
      en: "Flying over the terminator—the boundary between lunar day and night, which the astronauts described as 'anything but a straight line'—on April 6, 2026, crater rims stand out like sunlit islands in the night. Chains of secondary craters ejected from the 3.7-billion-year-old Orientale basin cut across the flatter Hertzsprung basin at center, proving that Hertzsprung is older still."
    alt:
      es: "Superficie lunar iluminada con luz rasante junto a la frontera nocturna, donde largas hileras de cráteres cruzan una llanura circular y las crestas brillan sobre la sombra."
      en: "Lunar terrain in low-angle sunlight along the night boundary, with long chains of craters crossing a broad basin and high rims catching light against the shadow."
    facts:
      - id: "photo-farside-8-terminator-hertzsprung"
        claim:
          es: "Fotografía del 6 de abril de 2026 del terminador lunar, descrito por la tripulación como «cualquier cosa menos una línea recta», donde cadenas de cráteres procedentes de la cuenca Orientale (de 3.700 millones de años) marcan el interior de la más antigua cuenca Hertzsprung."
          en: "April 6, 2026 photograph of the lunar terminator, described by the crew as 'anything but a straight line,' where crater chains from the 3.7-billion-year-old Orientale basin scar the older Hertzsprung basin."
        sources:

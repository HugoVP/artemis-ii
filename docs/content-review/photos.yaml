  - nasaId: NHQ202604010227
    chapter: launch
    title:
      es: "El despegue y su reflejo"
      en: "Liftoff and its reflection"
    caption:
      es: "El cohete SLS con la nave Orion despega del Complejo de Lanzamiento 39B con Reid Wiseman, Victor Glover, Christina Koch y Jeremy Hansen a bordo. Foto: NASA/Bill Ingalls."
      en: "The SLS rocket carrying the Orion spacecraft lifts off from Launch Complex 39B with Reid Wiseman, Victor Glover, Christina Koch and Jeremy Hansen on board. Photo: NASA/Bill Ingalls."
    alt:
      es: "El cohete en pleno despegue, con una larga llama bajo él que se refleja en el agua de un estanque."
      en: "The rocket at liftoff, with a long flame beneath it reflected in the water of a pond."
    sources:
      - https://images.nasa.gov/details/NHQ202604010227
    story:
      es: >-
        El 1 de abril de 2026, antes del despegue, Reid Wiseman, Victor Glover, Christina Koch y Jeremy Hansen
        saludaron a familiares, amigos y personal de la NASA frente al edificio de Operaciones y Verificación.
        A las 18:35, hora del este de EE. UU., el cohete SLS con la nave Orion despegó del Complejo de Lanzamiento
        39B del Centro Espacial Kennedy, en Florida. Era el primer vuelo tripulado del programa Artemis, un viaje de
        unos diez días alrededor de la Luna y de vuelta a la Tierra.
      en: >-
        On 1 April 2026, before liftoff, Reid Wiseman, Victor Glover, Christina Koch and Jeremy Hansen greeted family,
        friends and NASA employees outside the Operations and Checkout Building. At 6:35 p.m. EDT the SLS rocket and
        the Orion spacecraft lifted off from Launch Complex 39B at Kennedy Space Center in Florida. It was the first
        crewed flight of the Artemis program, a journey of about ten days around the Moon and back to Earth.
      sources:
        - https://images.nasa.gov/details/NHQ202604010227
        - https://images.nasa.gov/details/AFRC2026-0068-03
        - https://images.nasa.gov/details/KSC-04012026-Artemis%20II_Launch-1

  - nasaId: SLS_MAF_20260401_ArtemisIILaunch_05
    chapter: launch
    title:
      es: "Ascenso"
      en: "The climb"
    caption:
      es: "El cohete trepa sobre su columna de fuego, entre nubes, poco después de despegar el 1 de abril de 2026. Foto: NASA/Michael DeMocker."
      en: "The rocket climbs on its column of fire between clouds, moments after liftoff on 1 April 2026. Photo: NASA/Michael DeMocker."
    alt:
      es: "Vista cercana del cohete ascendiendo sobre una intensa columna de fuego, con nubes a ambos lados."
      en: "A close view of the rocket ascending on an intense column of fire, with clouds on both sides."
    sources:
      - https://images.nasa.gov/details/SLS_MAF_20260401_ArtemisIILaunch_05

  # ---- Outbound (display order 1, 4, 3, 2, 5) ----
  - nasaId: art002e000192
    chapter: outbound
    title:
      es: "La Tierra a la luz de la Luna"
      en: "Earth by moonlight"
    caption:
      es: "Una noche en la Tierra, fotografiada el 2 de abril de 2026 desde una ventana de Orion, tras el encendido que puso la nave rumbo a la Luna. El hemisferio visible parece iluminado por el Sol, pero la luz es la de la Luna reflejando el Sol."
      en: "Night on Earth, photographed on 2 April 2026 through an Orion window after the burn that sent the spacecraft toward the Moon. The visible hemisphere looks sunlit, but it is lit by moonlight, which is reflected sunlight."
    alt:
      es: "El disco de la Tierra sobre fondo negro, con auroras verdes en dos bordes, el contorno de África a la izquierda, luces de ciudades en las costas y un fino creciente luminoso en el borde inferior derecho."
      en: "The disk of Earth on a black background, with green auroras along two edges, the outline of Africa on the left, city lights along coastlines and a thin bright crescent at the lower right edge."
    sources:
      - https://images.nasa.gov/details/art002e000192
    story:
      es: >-
        Tras completar el encendido de inyección translunar, el 2 de abril de 2026, un tripulante apuntó una cámara
        por una ventana de Orion hacia la Tierra. En la imagen se ven auroras verdes en dos bordes del disco,
        África a la izquierda y las luces de las ciudades a lo largo de las costas. Un cono tenue de luz zodiacal,
        causado por el Sol reflejándose en polvo interplanetario, se extiende hacia Venus. En la cabina, Reid
        Wiseman también miró hacia atrás por una de las ventanas principales mientras la tripulación se alejaba
        de casa.
      en: >-
        After completing the translunar injection burn on 2 April 2026, a crew member aimed a camera through an
        Orion window at Earth. The image shows green auroras along two edges of the disk, Africa on the left and city
        lights along the coastlines. A faint cone of zodiacal light, caused by sunlight reflecting off interplanetary
        dust, reaches toward Venus. Inside the cabin, Reid Wiseman also looked back through one of the main windows
        as the crew traveled away from home.
      sources:
        - https://images.nasa.gov/details/art002e000192
        - https://images.nasa.gov/details/art002e009007
        - https://www.nasa.gov/image-detail/amf-art002e009007/

  - nasaId: art002e023575
    chapter: outbound
    title:
      es: "Un oasis en el vacío"
      en: "Oasis in the void"
    caption:
      es: "Un astronauta fotografió la Tierra desde una de las cuatro ventanas de Orion el 2 de abril de 2026."
      en: "An astronaut photographed Earth through one of Orion's four windows on 2 April 2026."
    alt:

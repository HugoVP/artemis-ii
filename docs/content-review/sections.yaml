openDecisions:
  - id: "conflict-launch-1-pad-date"
    item: "Artemis II at the pad Moon 01292026_4 (Launch 1)"
    summary: "The NASA Image Library record body states January 28, 2026, while the 508 description and index date state January 29, 2026."
    proposedHandling: "Leave the exact day unset in photo metadata (`date: null`) and describe the photograph in both languages as late January 2026 prelaunch preparation before the wet dress rehearsal unless Hugo selects one date."
    sources:
      - "https://images.nasa.gov/details/Artemis%20II%20at%20the%20pad%20Moon%2001292026_4"
  - id: "conflict-mission-1-capture-vs-index"
    item: "art002e000192 (Mission 1)"
    summary: "The library `date_created` index is 2026-04-03, while the description text states the photo was taken on April 2, 2026 after the translunar injection burn."
    proposedHandling: "Use 2026-04-02 (the caption-documented capture date after TLI, per CURATION.md) while keeping the April 3 index date noted in `dateConflict`."
    sources:
      - "https://images.nasa.gov/details/art002e000192"
  - id: "conflict-mission-3-april-2-vs-april-4"
    item: "art002e009007 (Mission 3)"
    summary: "The NASA image detail page (`amf-art002e009007`) and library `date_created` field say April 2, 2026, whereas the library description text header says `(April 4, 2026)`."
    proposedHandling: "Keep `date: null` as an open decision in `photos.yaml` and mention only the outbound leg in the caption until Hugo chooses whether to display April 2, April 4, or leave the date unset."
    sources:
      - "https://images.nasa.gov/details/art002e009007"
      - "https://www.nasa.gov/image-detail/amf-art002e009007/"
  - id: "conflict-mission-5-sleep-vs-soi"
    item: "art002e024097 (Mission 5)"
    summary: "The library index date is 2026-04-06 (referencing the 12:37 a.m. ET April 6 lunar sphere-of-influence crossing), while the description states Wiseman looked out at the Moon before going to sleep on Flight Day 5 (April 5, 2026)."
    proposedHandling: "Use 2026-04-05 as the capture date of the window view and explicitly distinguish it in the caption from the 12:37 a.m. ET April 6 sphere-of-influence crossing."
    sources:
      - "https://images.nasa.gov/details/art002e024097"
  - id: "conflict-eclipse-utc-vs-edt-dates"
    item: "art002e016324, art002e010782, art002e009575 (Mission 17, 19, 20)"
    summary: "Their library `date_created` fields are 2026-04-07 (reflecting UTC camera filenames after 00:00 UTC on April 7), while their descriptions date the eclipse to April 6, 2026 EDT."
    proposedHandling: "Use 2026-04-06 (consistent with EDT mission time and `art002e009301`, per CURATION.md) while documenting the April 7 UTC index date in `dateConflict`."
    sources:
      - "https://images.nasa.gov/details/art002e016324"
      - "https://images.nasa.gov/details/art002e010782"
      - "https://images.nasa.gov/details/art002e009575"
  - id: "conflict-orion-solar-cell-count"
    item: "Orion solar cells: '15,000 per wing' (NASA launch-day blog and installation article) vs about 15,000 in total (Airbus, builder of the European Service Module)"
    summary: "NASA's launch-day blog and its installation article say each of the four wings has 15,000 solar cells. Airbus describes four wings of three panels with 1,242 cells per panel, almost 15,000 cells in total (12 panels × 1,242 = 14,904), which matches the usual total of about 15,000 and not 60,000. The 23-foot wing length and the roughly 63-foot wingspan are not in dispute."
    proposedHandling: "State about 15,000 cells in total across the four wings and three panels per wing, citing Airbus, and keep the NASA pages as sources for the wing length and wingspan. Hugo may prefer to leave the cell count out until NASA clarifies its wording."
    sources:
      - "https://www.airbus.com/en/newsroom/news/2016-02-orion-spacecrafts-solar-array-successfully-put-to-the-test"
      - "https://www.nasa.gov/blogs/missions/2026/04/01/live-artemis-ii-launch-day-updates/"
      - "https://www.nasa.gov/image-article/engineers-install-orion-solar-array-wings-for-artemis-ii/"
  - id: "conflict-peak-and-total-distance-figures"
    item: "Peak distance from Earth (252,756 vs 252,760 miles) and total trajectory distance (694,481 vs 695,081 miles)"
    summary: "NASA's pre-flight FAQ lists estimated figures of 252,760 miles (max distance) and 695,081 miles (total trip), while the Flight Day 6 live blog and post-flight splashdown gallery record 252,756 miles and the updated post-flight FAQ states 694,481 miles."
    proposedHandling: "Lead with the post-flight logged figures (252,756 miles and 694,481 miles) and explicitly mention the pre-flight estimates in parentheses with both sources linked."
    sources:
      - "https://www.nasa.gov/blogs/missions/2026/04/06/artemis-ii-flight-day-6-lunar-flyby-updates/"
      - "https://www.nasa.gov/gallery/artemis-ii-splashdown/"
      - "https://www.nasa.gov/missions/nasa-answers-your-most-pressing-artemis-ii-questions/"

omittedUnverifiableFacts:
  - id: "omitted-splashdown-exact-coordinates"
    description: "Exact latitude and longitude of the Pacific Ocean splashdown point."
    reason: "Official NASA blogs and photo records state 'in the Pacific Ocean off the coast of San Diego, California' without publishing exact geographic coordinates."
  - id: "omitted-milky-way-exact-timestamp"
    description: "Exact UTC/EDT capture time for the Milky Way photograph (`art002e012588`)."
    reason: "The NASA record gives the date (April 7, 2026) and filename `Star Field from 200 000 nm_019A.NEF`, but no clock timestamp."
  - id: "omitted-camera-models"
    description: "Specific camera body and lens models for the 33 photographs."
    reason: "The NASA Image Library API records provide raw filenames (`.NEF`, `.DNG`, or `cmasaw3_...JPG` for the solar array wing camera) in `description_508`, not verified camera body or focal-length metadata, except where the caption explicitly identifies a solar-array-wing mounted camera (`art002e016299`, `art002e016324`, `art002e009575`)."
  - id: "omitted-crater-formal-iau-approval"
    description: "Formal International Astronomical Union (IAU) approval of the crater names Integrity and Carroll."
    reason: "NASA records and the Preliminary Lunar Science Report describe both names as proposed/suggested by the Artemis II crew; formal nomenclature approval is not claimed."
  - id: "omitted-recovery-medical-or-emotional-claims"
    description: "Any medical explanation for recovery assistance on USS John P. Murtha or unrecorded personal thoughts of crew members looking out Orion's windows."
    reason: "Excluded per CONT-03 and CURATION.md editorial direction; descriptions stay strictly observational."

      - id: "timeline-5-eclipse"
        order: 5
        dateLabel:
          es: "Día de vuelo 6 · 6 de abril de 2026, 8:35–9:32 p. m. EDT"
          en: "Flight Day 6 · April 6, 2026, 8:35–9:32 p.m. EDT"
        title:
          es: "Eclipse solar total desde el espacio profundo y destellos de impacto"
          en: "Deep-space total solar eclipse and lunar impact flashes"
        description:
          es: >-
            Poco después del sobrevuelo, entre las 8:35 y las 9:32 p. m. EDT del 6 de abril, Orion atravesó la sombra de la Luna y la tripulación presenció un eclipse solar con casi 54 minutos de totalidad. Desde esa perspectiva única documentaron corrientes de la corona solar, luz zodiacal, los planetas Venus y Saturno, y breves destellos de luz sobre el disco lunar en sombra producidos por el impacto de meteoroides: seis reportados inicialmente por radio a las 9:00 p. m. EDT y cinco confirmados en el informe científico preliminar actualizado el 7 de octubre de 2026.
          en: >-
            Shortly after closest approach, between 8:35 and 9:32 p.m. EDT on April 6, Orion passed through the Moon's shadow and the crew witnessed a solar eclipse featuring nearly 54 minutes of totality. From that vantage point they documented solar coronal streamers, zodiacal light, the planets Venus and Saturn, and brief pinpoint flashes on the unlit lunar surface caused by meteoroid impacts—six initially reported by radio at 9:00 p.m. EDT, with five confirmed in the preliminary lunar science report updated on October 7, 2026.
        facts:
          - id: "mission-eclipse-and-flashes"
            claim:
              es: "El eclipse solar observado desde Orion el 6 de abril de 2026 se extendió de las 8:35 a las 9:32 p. m. EDT con casi 54 minutos de totalidad; el informe científico preliminar del 7 de octubre de 2026 confirma cinco destellos de impacto de meteoroides a unas 46.000 millas de distancia (frente a los seis comunicados inicialmente a las 9:00 p. m. EDT)."
              en: "The solar eclipse observed from Orion on April 6, 2026, ran from 8:35 to 9:32 p.m. EDT with nearly 54 minutes of totality; the preliminary lunar science report updated October 7, 2026, confirms five meteoroid impact flashes observed from roughly 46,000 miles away (compared with six initially reported at 9:00 p.m. EDT)."
            sources:
              - title: "NASA Blog: Artemis II Flight Day 6 — Lunar Flyby Updates (April 6, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/06/artemis-ii-flight-day-6-lunar-flyby-updates/"
                accessed: "2026-10-21"

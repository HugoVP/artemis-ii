        claim:
          es: "Artemis II duró 9 días, 1 hora y 32 minutos (del 1 al 10 de abril de 2026) y recorrió aproximadamente 694.481 millas (695.081 millas en la estimación previa al vuelo) en una trayectoria de retorno libre con un acercamiento mínimo a la Luna de 4.067 millas."
          en: "Artemis II lasted 9 days, 1 hour, and 32 minutes (April 1 to April 10, 2026) and traveled approximately 694,481 miles (695,081 miles in the pre-flight estimate) on a free-return trajectory with a closest lunar approach of 4,067 miles."

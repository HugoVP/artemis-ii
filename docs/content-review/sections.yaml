      en: "Every figure and historical milestone of Artemis II is backed by official NASA flight logs and science reports."
    milestones:
      - id: "milestone-farthest-distance"
        title:
          es: "Mayor distancia humana desde la Tierra: 252.756 millas"
          en: "Farthest human distance from Earth: 252,756 miles"
        description:
          es: >-
            El 6 de abril de 2026 a la 1:56 p. m. EDT, Artemis II superó la marca de 248.655 millas alcanzada por Apolo 13 el 14 de abril de 1970. A las 7:02 p. m. EDT del mismo día alcanzó su distancia máxima de 252.756 millas de la Tierra (4.101 millas más allá de Apolo 13; la guía previa al vuelo estimaba 252.760 millas).
          en: >-
            On April 6, 2026, at 1:56 p.m. EDT, Artemis II surpassed the 248,655-mile record set by Apollo 13 on April 14, 1970. At 7:02 p.m. EDT that evening, the spacecraft reached its maximum distance of 252,756 miles from Earth (4,101 miles beyond Apollo 13; NASA's pre-flight FAQ estimated 252,760 miles).
        facts:
          - id: "fact-milestone-distance"
            claim:
              es: "Artemis II superó el récord de Apolo 13 (248.655 millas) a la 1:56 p. m. EDT del 6 de abril de 2026 y alcanzó una distancia máxima de 252.756 millas a las 7:02 p. m. EDT (252.760 millas en la estimación previa)."
              en: "Artemis II broke Apollo 13's 248,655-mile distance record at 1:56 p.m. EDT on April 6, 2026, and reached a maximum distance from Earth of 252,756 miles at 7:02 p.m. EDT (252,760 miles in the pre-flight estimate)."
            sources:
              - title: "NASA Blog: Artemis II Flight Day 6 — Lunar Flyby Updates (April 6, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/06/artemis-ii-flight-day-6-lunar-flyby-updates/"
                accessed: "2026-10-21"

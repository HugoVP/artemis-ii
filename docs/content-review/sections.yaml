sections:
  launch:
    slug:
      es: "despegue"
      en: "launch"
    title:
      es: "El despegue"
      en: "The launch"
    intro:
      es: "El 1 de abril de 2026 a las 6:35 p. m. EDT, el cohete Space Launch System y la nave Orion despegaron desde el Complejo de Lanzamiento 39B en Florida con cuatro astronautas a bordo rumbo a la Luna."
      en: "On April 1, 2026, at 6:35 p.m. EDT, the Space Launch System rocket and the Orion spacecraft lifted off from Launch Complex 39B in Florida carrying four astronauts toward the Moon."
    dateLine:
      es: "1 de abril de 2026 · 6:35 p. m. EDT (22:35 UTC) · Complejo de Lanzamiento 39B, Centro Espacial Kennedy, Florida"
      en: "April 1, 2026 · 6:35 p.m. EDT (22:35 UTC) · Launch Complex 39B, Kennedy Space Center, Florida"
    summary:
      es: >-
        Al caer la tarde del miércoles 1 de abril de 2026, una columna de fuego iluminó los humedales de Cabo Cañaveral y se reflejó en las lagunas que rodean la plataforma 39B. Con 8,8 millones de libras de empuje, el cohete Space Launch System (SLS) alzó la nave Orion —bautizada Integrity por su tripulación— en el primer vuelo tripulado del programa Artemis. A bordo viajaban los astronautas de NASA Reid Wiseman, Victor Glover y Christina Koch junto al astronauta de la Agencia Espacial Canadiense (CSA) Jeremy Hansen. Tras horas de carga criogénica, revisiones de estanqueidad en el edificio Neil A. Armstrong y una breve pausa técnica a diez minutos del final de la cuenta regresiva para verificar el sistema de terminación de vuelo del rango oriental, la directora de lanzamiento Charlie Blackwell-Thompson dio luz verde para el despegue once minutos después de abrirse la ventana de dos horas. En apenas ocho minutos y catorce segundos de ascenso, el cohete situó a Integrity en órbita terrestre inicial y desplegó sus cuatro paneles solares antes de las maniobras que elevarían su apogeo para probar los sistemas de la nave.
      en: >-
        In the early evening of Wednesday, April 1, 2026, a pillar of fire lit the marshes of Cape Canaveral and mirrored across the lagoons around Pad 39B. Generating 8.8 million pounds of thrust, the Space Launch System (SLS) rocket lifted the Orion spacecraft—named Integrity by its crew—on the first crewed flight of the Artemis campaign. Aboard were NASA astronauts Reid Wiseman, Victor Glover, and Christina Koch alongside Canadian Space Agency (CSA) astronaut Jeremy Hansen. Following hours of cryogenic propellant loading, suit leak checks inside the Neil A. Armstrong Operations and Checkout Building, and a brief hold at T-minus 10 minutes to verify an Eastern Range flight termination system communication link, Launch Director Charlie Blackwell-Thompson gave the go for liftoff eleven minutes into the two-hour launch window. In eight minutes and fourteen seconds of powered ascent, the rocket placed Integrity into its initial orbit, followed within twenty minutes by the deployment of its four solar array wings ahead of high-Earth-orbit checkouts.
    phasesTitle:
      es: "Fases de la cuenta regresiva y del ascenso"
      en: "Countdown and ascent phases"
    phases:
      - id: "launch-phase-1"
        order: 1
        timeLabel:
          es: "T-9 h a T-10 min · 1 de abril de 2026"
          en: "T-9 hr to T-10 min · April 1, 2026"
        title:
          es: "Carga criogénica, trajes presurizados y cierre de escotilla"
          en: "Cryogenic tanking, suit checks, and hatch closeout"
        description:
          es: >-
            Los equipos en tierra cargaron más de 700.000 galones de hidrógeno y oxígeno líquidos en la etapa central del SLS y en la etapa de propulsión criogénica provisional (ICPS). Tras despertar a las 9:25 a. m. EDT, los cuatro astronautas vistieron sus trajes naranjas del sistema de supervivencia Orion (OCSS), salieron del edificio de operaciones a las 2:00 p. m. EDT para saludar a familiares y trabajadores, llegaron a la plataforma 39B a las 2:14 p. m. EDT e ingresaron a la cápsula desde la Sala Blanca a las 2:31 p. m. EDT.
          en: >-
            Ground teams loaded more than 700,000 gallons of super-cold liquid hydrogen and liquid oxygen into the SLS core stage and the Interim Cryogenic Propulsion Stage (ICPS). After waking at 9:25 a.m. EDT, the four astronauts donned their orange Orion Crew Survival System (OCSS) suits, walked out of the Operations and Checkout Building at 2:00 p.m. EDT to wave to family and staff, arrived at Pad 39B at 2:14 p.m. EDT, and boarded Orion from the White Room beginning at 2:31 p.m. EDT.
        facts:
          - id: "launch-tanking-gallons"
            claim:
              es: "Se cargaron más de 700.000 galones de propulsante criogénico (hidrógeno líquido y oxígeno líquido) en el cohete SLS."
              en: "More than 700,000 gallons of cryogenic propellant (liquid hydrogen and liquid oxygen) were loaded into the SLS rocket."
            sources:
              - title: "NASA Blog: Live Artemis II Launch Day Updates (April 1, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/01/live-artemis-ii-launch-day-updates/"
                accessed: "2026-10-21"
          - id: "launch-walkout-and-ingress"
            claim:
              es: "La tripulación salió del edificio Neil A. Armstrong a las 2:00 p. m. EDT, llegó a la plataforma 39B a las 2:14 p. m. EDT y comenzó a abordar Orion a las 2:31 p. m. EDT del 1 de abril de 2026."
              en: "The crew walked out of the Neil A. Armstrong Operations and Checkout Building at 2:00 p.m. EDT, arrived at Pad 39B at 2:14 p.m. EDT, and began boarding Orion at 2:31 p.m. EDT on April 1, 2026."
            sources:
              - title: "NASA Blog: Live Artemis II Launch Day Updates (April 1, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/01/live-artemis-ii-launch-day-updates/"
                accessed: "2026-10-21"
              - title: "NASA Image and Video Library: AFRC2026-0068-03"
                url: "https://images.nasa.gov/details/AFRC2026-0068-03"
                accessed: "2026-10-20"
      - id: "launch-phase-2"
        order: 2
        timeLabel:
          es: "T-00:00:00 · 6:35 p. m. EDT"
          en: "T-00:00:00 · 6:35 p.m. EDT"
        title:
          es: "Encendido de motores RS-25 y despegue desde el Complejo 39B"
          en: "RS-25 ignition and liftoff from Launch Complex 39B"
        description:
          es: >-
            A las 6:25 p. m. EDT el secuenciador de lanzamiento en tierra tomó el control de la cuenta terminal. Seis segundos antes de cero se encendieron en secuencia los cuatro motores RS-25 de combustible líquido; al llegar a cero se activaron los dos propulsores sólidos de cinco segmentos y las abrazaderas liberaron el vehículo de 5,75 millones de libras, que ascendió con 8,8 millones de libras de empuje a las 6:35 p. m. EDT.
          en: >-
            At 6:25 p.m. EDT the Ground Launch Sequencer assumed control of the terminal countdown. Roughly six seconds before zero, the four liquid-fueled RS-25 engines ignited in staggered sequence; at zero, the twin five-segment solid rocket boosters ignited and hold-down bolts released the 5.75-million-pound vehicle, lifting off under 8.8 million pounds of thrust at 6:35 p.m. EDT.
        facts:
          - id: "launch-liftoff-time-and-thrust"
            claim:
              es: "Artemis II despegó a las 6:35 p. m. EDT del 1 de abril de 2026 desde el Complejo de Lanzamiento 39B con 8,8 millones de libras de empuje y un peso total de 5,75 millones de libras."
              en: "Artemis II lifted off at 6:35 p.m. EDT on April 1, 2026, from Launch Complex 39B with 8.8 million pounds of thrust and a liftoff weight of 5.75 million pounds."
            sources:
              - title: "NASA Blog: Live Artemis II Launch Day Updates (April 1, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/01/live-artemis-ii-launch-day-updates/"
                accessed: "2026-10-21"
              - title: "NASA Curious Universe Podcast Transcript: Artemis II Crew Flies Around the Moon"
                url: "https://www.nasa.gov/podcasts/curious-universe/artemis-ii-circles-moon/"
                accessed: "2026-10-20"
              - title: "NASA Image and Video Library: NHQ202604010227"
                url: "https://images.nasa.gov/details/NHQ202604010227"
                accessed: "2026-10-20"
      - id: "launch-phase-3"
        order: 3
        timeLabel:
          es: "MET +00:00:56 a +00:02:09 · 6:36–6:37 p. m. EDT"
          en: "MET +00:00:56 to +00:02:09 · 6:36–6:37 p.m. EDT"
        title:
          es: "Velocidad supersónica, Max Q y separación de los propulsores sólidos"
          en: "Supersonic climb, Max Q, and solid rocket booster separation"
        description:
          es: >-
            El cohete superó la barrera del sonido a los 56 segundos de vuelo y atravesó el punto de máxima presión aerodinámica (Max Q) a los 72 segundos. Tras consumir su propulsante durante poco más de dos minutos, los dos propulsores sólidos de 177 pies de longitud se separaron limpiamente de la etapa central a las 6:37 p. m. EDT (MET +00:02:09).
          en: >-
            The rocket broke the sound barrier 56 seconds into flight and passed through maximum dynamic pressure (Max Q) at 1 minute and 12 seconds. Having burned their propellant for just over two minutes, the twin 177-foot solid rocket boosters separated cleanly from the core stage at 6:37 p.m. EDT (MET +00:02:09).
        facts:
          - id: "launch-maxq-and-srb-sep"
            claim:
              es: "El SLS superó Mach 1 a los 56 segundos, pasó por Max Q a 1 minuto y 12 segundos, y separó sus dos propulsores sólidos de 177 pies a los 2 minutos y 9 segundos (6:37 p. m. EDT)."
              en: "SLS reached supersonic speed at 56 seconds, passed Max Q at 1 minute 12 seconds, and separated its twin 177-foot solid rocket boosters at 2 minutes 9 seconds into flight (6:37 p.m. EDT)."
            sources:
              - title: "NASA Blog: Live Artemis II Launch Day Updates (April 1, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/01/live-artemis-ii-launch-day-updates/"
                accessed: "2026-10-21"
      - id: "launch-phase-4"
        order: 4
        timeLabel:
          es: "MET +00:03:13 a +00:18:00 · 6:38–6:59 p. m. EDT"
          en: "MET +00:03:13 to +00:18:00 · 6:38–6:59 p.m. EDT"
        title:
          es: "Eyección de la torre de aborto, corte de etapa central y despliegue solar"
          en: "Launch abort system jettison, core stage cutoff, and solar array deployment"
        description:
          es: >-
            Ya por encima de la parte más densa de la atmósfera, a los 3 minutos y 13 segundos se desprendieron los paneles del módulo de servicio y la torre del sistema de aborto de lanzamiento (LAS). A los 8 minutos y 2 segundos se apagaron los cuatro motores RS-25 (MECO) y, doce segundos después (6:43 p. m. EDT), la etapa central se separó de la etapa superior ICPS y de Orion. Alrededor de dieciocho minutos después del despegue (confirmado a las 6:59 p. m. EDT), Orion desplegó sus cuatro alas de paneles solares —de casi 23 pies cada una, para una envergadura total de la nave de unos 63 pies—, con tres paneles por ala y casi 15.000 celdas fotovoltaicas en total.
          en: >-
            Above the dense lower atmosphere at 3 minutes and 13 seconds, the service module fairing panels and the Launch Abort System (LAS) tower were jettisoned. Main engine cutoff (MECO) of the four RS-25 engines occurred at 8 minutes and 2 seconds, followed twelve seconds later (6:43 p.m. EDT) by separation of the core stage from the ICPS and Orion. Roughly eighteen minutes after liftoff (confirmed by 6:59 p.m. EDT), Orion deployed its four solar array wings—nearly 23 feet long apiece, giving the spacecraft a total deployed wingspan of roughly 63 feet—with three panels per wing and almost 15,000 solar cells in total.
        facts:
          - id: "launch-las-meco-solar"
            claim:
              es: "Los paneles del módulo de servicio y el sistema de aborto de lanzamiento se desprendieron a MET +00:03:13 (6:38 p. m. EDT); el corte de motores principales ocurrió a MET +00:08:02 y la separación de la etapa central a MET +00:08:14 (6:43 p. m. EDT), seguidos a las 6:59 p. m. EDT por el despliegue de las cuatro alas de paneles solares de Orion (casi 23 pies por ala, para una envergadura total de la nave de unos 63 pies; tres paneles por ala y casi 15.000 celdas fotovoltaicas en total)."
              en: "The service module panels and Launch Abort System were jettisoned at MET +00:03:13 (6:38 p.m. EDT); main engine cutoff occurred at MET +00:08:02 and core stage separation at MET +00:08:14 (6:43 p.m. EDT), followed by 6:59 p.m. EDT by deployment of Orion's four solar array wings (nearly 23 feet per wing, for a total spacecraft wingspan of roughly 63 feet; three panels per wing and almost 15,000 solar cells in total)."
            sources:
              - title: "NASA Blog: Live Artemis II Launch Day Updates (April 1, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/01/live-artemis-ii-launch-day-updates/"
                accessed: "2026-10-21"
              - title: "NASA Image Article: Engineers Install Orion Solar Array Wings for Artemis II"
                url: "https://www.nasa.gov/image-article/engineers-install-orion-solar-array-wings-for-artemis-ii/"
                accessed: "2026-10-21"
              - title: "Airbus (builder of the European Service Module): Orion spacecraft's solar array successfully put to the test (2016)"
                url: "https://www.airbus.com/en/newsroom/news/2016-02-orion-spacecrafts-solar-array-successfully-put-to-the-test"
                accessed: "2026-10-21"

    facts:
      - id: "launch-crew-and-spacecraft-name"
        claim:
          es: "La tripulación de Artemis II estuvo integrada por los astronautas de NASA Reid Wiseman (comandante), Victor Glover (piloto) y Christina Koch (especialista de misión), y el astronauta de la Agencia Espacial Canadiense (CSA) Jeremy Hansen (especialista de misión), a bordo de la nave Orion bautizada Integrity."

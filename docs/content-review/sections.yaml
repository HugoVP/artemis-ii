    intro:
      es: >-
        Cuando Eugene Cernan, Ronald Evans y Harrison Schmitt regresaron a la Tierra a bordo de Apolo 17 el 19 de diciembre de 1972, se cerró la primera era de exploración humana más allá de la órbita terrestre baja. Pasaron más de cincuenta y tres años en los que ningún ser humano volvió a contemplar de cerca el relieve lunar ni a ver la Tierra reducirse hasta caber detrás del pulgar. Artemis II rompió ese silencio de medio siglo: no para repetir una carrera corta de banderas y huellas, sino para abrir una presencia científica y sostenida en el espacio profundo junto a socios internacionales.
      en: >-
        When Eugene Cernan, Ronald Evans, and Harrison Schmitt splashed down aboard Apollo 17 on December 19, 1972, the first era of human exploration beyond low Earth orbit came to a close. For more than fifty-three years, no human being saw the lunar highlands up close or watched Earth shrink into a crescent suspended in the dark. Artemis II ended that half-century pause—not to replay a brief sprint of flags and footprints, but to inaugurate a sustained, international scientific presence in deep space.
    programTitle:
      es: "El papel de Artemis II en el programa Artemis"
      en: "Artemis II's role in the Artemis campaign"
    programBody:
      es: >-
        Tras el vuelo sin tripulación de Artemis I en noviembre de 2022, Artemis II fue la prueba decisiva con astronautas del cohete Space Launch System (SLS), de la nave Orion y su Módulo de Servicio Europeo, y de los sistemas de tierra del Centro Espacial Kennedy. En diez días de misión demostró que el soporte vital ambiental, el blindaje contra la radiación, las comunicaciones ópticas y por radiofrecuencia de espacio profundo, el pilotaje manual y el escudo térmico a Mach 35 funcionan con una tripulación humana. Al mismo tiempo, el trabajo conjunto entre la cabina de Orion y la Sala de Evaluación Científica en Houston —apoyado en el Lunar Targeting Plan— puso a prueba en tiempo real los protocolos de observación geológica que guiarán a los futuros astronautas en la superficie.
      en: >-
        Following the uncrewed Artemis I test flight in November 2022, Artemis II served as the decisive crewed flight test of the Space Launch System (SLS) rocket, the Orion spacecraft with its European Service Module, and Exploration Ground Systems at Kennedy Space Center. Across ten mission days, it proved that environmental life support, radiation shelter procedures, deep-space radio and optical laser communications, manual piloting, and Orion's heat shield at Mach 35 perform reliably with astronauts aboard. At the same time, real-time collaboration between the crew in Orion and the Science Evaluation Room in Houston—guided by the Lunar Targeting Plan—validated the geological observation workflows that surface crews will rely on.
    nextTitle:
      es: "Lo que sigue: de la órbita terrestre al polo sur lunar y Marte"
      en: "What comes next: from Earth orbit to the lunar South Pole and Mars"
    nextBody:
      es: >-
        Con la arquitectura de Artemis actualizada por NASA en 2026 para acelerar el aprendizaje y la seguridad de vuelo, el camino hacia la superficie lunar avanza paso a paso. Artemis III, prevista para 2027, será una misión tripulada en órbita terrestre baja dedicada a probar en vuelo el encuentro, el acoplamiento y las operaciones conjuntas entre Orion y los módulos de aterrizaje humano comerciales desarrollados por SpaceX y Blue Origin, además de validar los nuevos trajes espaciales de actividad extravehicular. Esos ensayos preparan el terreno para Artemis IV a principios de 2028, que llevará astronautas a la superficie de la región del polo sur lunar, y para Artemis V a finales de 2028, con el objetivo de establecer una cadencia anual de misiones, levantar la infraestructura inicial en la Luna y preparar las primeras misiones humanas hacia Marte.
      en: >-
        Under the refined Artemis architecture announced by NASA in early 2026 to increase flight cadence and reduce technical risk, the path to the lunar surface proceeds deliberately. Artemis III, targeted for 2027, will fly a crewed demonstration in low Earth orbit to test rendezvous, docking, and integrated life-support operations between Orion and commercial human landers from SpaceX and Blue Origin, alongside checks of next-generation extravehicular spacesuits. Those milestones clear the way for Artemis IV in early 2028—which will land astronauts near the lunar South Pole—and Artemis V in late 2028, establishing an annual landing cadence, building surface infrastructure, and proving the deep-space operations needed for future human missions to Mars.
    sourcesLabel:
      es: "Fuentes oficiales consultadas"
      en: "Official sources consulted"
    facts:
      - id: "why-apollo-17-gap"
        claim:
          es: "Apolo 17 (7 al 19 de diciembre de 1972, con Eugene Cernan, Ronald Evans y Harrison Schmitt) fue la última misión tripulada a la Luna antes de Artemis II en abril de 2026, un intervalo de más de 53 años."
          en: "Apollo 17 (December 7–19, 1972, crewed by Eugene Cernan, Ronald Evans, and Harrison Schmitt) was the last crewed mission to the Moon prior to Artemis II in April 2026, a span of more than 53 years."
        sources:
          - title: "NASA Mission Page: Apollo 17"
            url: "https://www.nasa.gov/mission/apollo-17/"
            accessed: "2026-10-21"
          - title: "NASA Mission Page: Artemis II"
            url: "https://www.nasa.gov/mission/artemis-ii/"
            accessed: "2026-10-21"
      - id: "why-artemis-validation"
        claim:
          es: "Tras el vuelo no tripulado Artemis I en noviembre de 2022, Artemis II certificó con tripulación el cohete SLS, la nave Orion con su Módulo de Servicio Europeo, el escudo térmico en reentrada desde velocidad lunar y las operaciones conjuntas de ciencia lunar entre los astronautas y la Sala de Evaluación Científica."
          en: "Following the uncrewed Artemis I flight in November 2022, Artemis II certified with a crew the SLS rocket, the Orion spacecraft and its European Service Module, the heat shield at lunar return velocity, and real-time lunar science operations between the astronauts and the Science Evaluation Room."
        sources:
          - title: "NASA Mission Page: Artemis II"
            url: "https://www.nasa.gov/mission/artemis-ii/"
            accessed: "2026-10-21"
          - title: "Artemis II Preliminary Lunar Science Report (updated October 7, 2026)"
            url: "https://science.nasa.gov/feature/artemis-ii-preliminary-lunar-science-report/"
            accessed: "2026-10-20"
      - id: "why-artemis-iii-iv-v-architecture"
        claim:
          es: "Según la actualización de arquitectura de Artemis de NASA en 2026, Artemis III (prevista para 2027) probará en órbita terrestre baja el acoplamiento entre Orion y los módulos de aterrizaje comerciales de SpaceX y Blue Origin; Artemis IV (prevista para principios de 2028) realizará el primer alunizaje tripulado de la campaña en el polo sur lunar; y Artemis V (prevista para finales de 2028) continuará el despliegue de infraestructura lunar rumbo a futuras misiones a Marte."
          en: "Under NASA's 2026 Artemis architecture update, Artemis III (targeted for 2027) will test rendezvous and docking in low Earth orbit between Orion and commercial human landers from SpaceX and Blue Origin; Artemis IV (targeted for early 2028) will conduct the campaign's first crewed lunar South Pole landing; and Artemis V (targeted for late 2028) will advance lunar surface infrastructure toward future crewed missions to Mars."
        sources:
          - title: "NASA ESDMD: NASA Strengthens Artemis: Adds Mission, Refines Overall Architecture (2026)"
            url: "https://www.nasa.gov/directorates/esdmd/nasa-strengthens-artemis-adds-mission-refines-overall-architecture/"
            accessed: "2026-10-21"
          - title: "NASA Mission Page: Artemis III"
            url: "https://www.nasa.gov/mission/artemis-iii/"
            accessed: "2026-10-21"
          - title: "NASA Mission Page: Artemis IV"
            url: "https://www.nasa.gov/mission/artemis-iv/"
            accessed: "2026-10-21"

supporting:
  home:
    heading:
      es: "Artemis II, de regreso a la Luna"
      en: "Artemis II, back to the Moon"
    welcome:
      es: "Un recorrido visual y documentado en español e inglés por los diez días en que cuatro astronautas rodearon la Luna a bordo de Orion en abril de 2026: desde el encendido en Cabo Cañaveral hasta el eclipse solar en el espacio profundo y el amerizaje en el Pacífico."
      en: "A documented visual journey in Spanish and English through the ten days in April 2026 when four astronauts flew around the Moon aboard Orion—from liftoff at Cape Canaveral to a deep-space solar eclipse and splashdown in the Pacific."
    featuredPhotoId: "art002e021278"
    cards:
      launch:
        es: "El ascenso del cohete SLS desde la plataforma 39B el 1 de abril de 2026, paso a paso y en imágenes."
        en: "The April 1, 2026 liftoff of the SLS rocket from Pad 39B, phase by phase and in photographs."
      mission:
        es: "Cronología de los diez días de vuelo, los cuatro integrantes de la tripulación y los récords verificados."
        en: "The ten-day flight timeline, the four crew members, and verified mission records."
      why-it-matters:
        es: "Qué significa volver al entorno lunar 53 años después de Apolo 17 y cómo prepara los alunizajes de Artemis."
        en: "What returning to the lunar vicinity 53 years after Apollo 17 means and how it prepares future Artemis landings."
      gallery:
        es: "Treinta y tres fotografías oficiales de NASA organizadas en cinco capítulos con sus historias y fuentes."
        en: "Thirty-three official NASA photographs organized across five chapters with their stories and sources."
  chapters:
    launch:
      order: 1
      title:
        es: "El despegue"
        en: "The launch"
      summary:
        es: "De la plataforma 39B con la Luna tras el cohete, a finales de enero de 2026, a la columna de fuego del 1 de abril de 2026: los preparativos, la caminata de la tripulación y el ascenso del cohete Space Launch System."
        en: "From Pad 39B with the Moon behind the rocket in late January 2026 to the pillar of fire on April 1, 2026: pad preparations, crew walkout, and the climb of the Space Launch System rocket."
    outbound:
      order: 2
      title:
        es: "Rumbo a la Luna"
        en: "Outbound"
      summary:
        es: "Tras el encendido de inyección translunar del 2 de abril, la Tierra se transforma tras las ventanillas de Orion en un disco iluminado por la luz de la Luna y luego en una fina creciente suspendida en el vacío."
        en: "After the April 2 translunar injection burn, Earth transforms outside Orion's windows into a moonlit disk with glowing auroras and then a thin crescent suspended in the void."
    far-side:
      order: 3
      title:
        es: "Lado oculto"
        en: "Far side"
      summary:
        es: "Siete horas de observación cercana a 4.067 millas sobre la Luna el 6 de abril: los anillos de la cuenca Orientale, los cráteres propuestos Integrity y Carroll, y la puesta y salida de la Tierra."
        en: "Seven hours of close observation 4,067 miles above the Moon on April 6: the concentric rings of the Orientale basin, the crew-proposed Integrity and Carroll craters, Earthset, and Earthrise."
    eclipse:
      order: 4
      title:
        es: "Eclipse"
        en: "Eclipse"
      summary:
        es: "Casi 54 minutos de totalidad solar vistos desde la sombra lunar: corrientes de la corona del Sol, luz zodiacal con Venus y Saturno, y la búsqueda de destellos de meteoroides en la noche lunar."
        en: "Nearly 54 minutes of solar totality witnessed inside the Moon's shadow: solar coronal streamers, zodiacal light with Venus and Saturn, and the watch for meteoroid impact flashes on the dark lunar disk."
    return:
      order: 5
      title:
        es: "Regreso"
        en: "Return"
      summary:
        es: "El camino de vuelta a casa entre el 7 y el 10 de abril: un campo estelar de la Vía Láctea el 7 de abril, retratos junto a la creciente terrestre y el descenso en paracaídas hacia el océano Pacífico."
        en: "The journey home from April 7 to April 10: a Milky Way star field on April 7, portraits beside the crescent Earth, and parachute descent into the Pacific Ocean."


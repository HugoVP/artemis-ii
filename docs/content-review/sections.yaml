                url: "https://www.nasa.gov/gallery/artemis-ii-splashdown/"
                accessed: "2026-10-21"
              - title: "NASA FAQ: NASA Answers Your Most Pressing Artemis II Questions"
                url: "https://www.nasa.gov/missions/nasa-answers-your-most-pressing-artemis-ii-questions/"
                accessed: "2026-10-21"
      - id: "milestone-firsts-crew"
        title:
          es: "Primeros vuelos lunares del siglo XXI y nuevas primicias humanas"
          en: "First 21st-century lunar flight and historic crew firsts"
        description:
          es: >-
            Artemis II fue la primera misión tripulada a la vecindad lunar desde Apolo 17 en diciembre de 1972 y el primer vuelo con astronautas del cohete SLS y la nave Orion. Christina Koch fue la primera mujer, Victor Glover la primera persona negra y Jeremy Hansen el primer canadiense y no estadounidense en viajar alrededor de la Luna.
          en: >-
            Artemis II was the first crewed mission to the lunar vicinity since Apollo 17 in December 1972 and the first crewed flight of both the SLS rocket and the Orion spacecraft. Christina Koch became the first woman, Victor Glover the first Black person, and Jeremy Hansen the first Canadian and non-American to fly around the Moon.
        facts:
          - id: "fact-milestone-firsts"
            claim:
              es: "Artemis II marcó el primer viaje tripulado a la Luna desde Apolo 17 (diciembre de 1972) y llevó a la primera mujer (Christina Koch), la primera persona negra (Victor Glover) y el primer canadiense (Jeremy Hansen) alrededor de la Luna."
              en: "Artemis II marked the first crewed lunar journey since Apollo 17 (December 1972) and carried the first woman (Christina Koch), the first Black person (Victor Glover), and the first Canadian (Jeremy Hansen) around the Moon."
            sources:
              - title: "NASA Mission Page: Artemis II"
                url: "https://www.nasa.gov/mission/artemis-ii/"
                accessed: "2026-10-21"
              - title: "NASA Mission Page: Apollo 17"
                url: "https://www.nasa.gov/mission/apollo-17/"
                accessed: "2026-10-21"
              - title: "NASA Curious Universe Podcast Transcript: Artemis II Crew Flies Around the Moon"
                url: "https://www.nasa.gov/podcasts/curious-universe/artemis-ii-circles-moon/"
                accessed: "2026-10-20"
      - id: "milestone-science-and-eclipse"
        title:
          es: "54 minutos de totalidad solar y más de 800 GB de ciencia lunar"
          en: "54 minutes of solar totality and over 800 GB of lunar science"
        description:
          es: >-
            Durante el sobrevuelo de siete horas y el eclipse solar de casi 54 minutos, la tripulación registró cinco destellos confirmados de impacto de meteoroides en la cara nocturna de la Luna y recopiló más de 800 gigabytes de datos —incluidos más de 11.000 archivos de imagen y video y 8,5 horas de notas de voz— analizados por el equipo científico de Artemis II.
          en: >-
            Across the seven-hour flyby and a solar eclipse with nearly 54 minutes of totality, the crew observed five confirmed meteoroid impact flashes on the unlit lunar disk and collected more than 800 gigabytes of data—including over 11,000 image and video files and 8.5 hours of audio descriptions—analyzed by the Artemis II science team.
        facts:
          - id: "fact-milestone-science-volume"
            claim:
              es: "La tripulación recopiló más de 800 GB de datos científicos (más de 11.000 imágenes y videos y 8,5 horas de audio), presenció casi 54 minutos de totalidad durante el eclipse solar y documentó cinco destellos confirmados de impacto de meteoroides."
              en: "The crew collected more than 800 GB of science data (over 11,000 images and videos and 8.5 hours of audio), witnessed nearly 54 minutes of solar eclipse totality, and documented five confirmed meteoroid impact flashes."
            sources:
              - title: "Artemis II Preliminary Lunar Science Report (updated October 7, 2026)"
                url: "https://science.nasa.gov/feature/artemis-ii-preliminary-lunar-science-report/"
                accessed: "2026-10-20"
              - title: "NASA Image and Video Library: art002e009301"
                url: "https://images.nasa.gov/details/art002e009301"
                accessed: "2026-10-20"
    facts:

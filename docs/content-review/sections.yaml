  mission:
    slug:
      es: "mision"
      en: "mission"
    title:
      es: "La misión"
      en: "The mission"
    intro:
      es: >-
        Artemis II fue un vuelo de prueba tripulado de diez días calendario (9 días, 1 hora y 32 minutos de duración total, del 1 al 10 de abril de 2026) que llevó a cuatro astronautas alrededor de la Luna en una trayectoria de retorno libre de unas 694.481 millas. A diferencia de futuras misiones de alunizaje, su objetivo fue certificar en el espacio profundo todos los sistemas de soporte vital, propulsión, navegación, comunicaciones y protección térmica de Orion, además de realizar observaciones científicas de la superficie lunar desde una distancia mínima de 4.067 millas.
      en: >-
        Artemis II was a ten-calendar-day crewed test flight (9 days, 1 hour, and 32 minutes total duration, from April 1 to April 10, 2026) that carried four astronauts around the Moon along a free-return trajectory of roughly 694,481 miles. Rather than landing on the lunar surface, the mission was designed to certify Orion's life support, propulsion, navigation, communication, and thermal protection systems in deep space while conducting coordinated lunar science observations from as close as 4,067 miles above the Moon.
    timelineTitle:
      es: "Cronología del viaje"
      en: "Mission timeline"
    timeline:
      - id: "timeline-1-launch-orbit"
        order: 1
        dateLabel:
          es: "Día de vuelo 1 · 1 de abril de 2026"
          en: "Flight Day 1 · April 1, 2026"
        title:
          es: "Despegue, órbita terrestre alta y pilotaje manual"
          en: "Liftoff, high-Earth orbit, and manual handling demonstration"
        description:
          es: >-
            Tras despegar a las 6:35 p. m. EDT y desplegar los paneles solares de Orion, la etapa superior ICPS elevó el perigeo y el apogeo de la órbita terrestre. Una vez separada de la ICPS, el piloto Victor Glover tomó los mandos manuales de Integrity durante unos 70 minutos en una demostración de operaciones de proximidad, acercando la nave a unos 30 pies de la etapa descartada para validar las cámaras de acoplamiento y el control de actitud antes de partir hacia la Luna.
          en: >-
            Following liftoff at 6:35 p.m. EDT and solar array deployment, the ICPS upper stage executed burns to raise Orion's Earth orbit. After separating from the ICPS, Pilot Victor Glover manually flew Integrity for roughly 70 minutes in a proximity operations demonstration, maneuvering within about 30 feet of the spent stage to validate Orion's handling qualities and docking cameras before committing to the lunar trajectory.
        facts:
          - id: "mission-prox-ops"
            claim:
              es: "En el día de vuelo 1, tras separarse de la etapa ICPS, el piloto Victor Glover realizó una demostración de operaciones de proximidad de unos 70 minutos aproximando Orion manualmente hasta unos 30 pies de la etapa ICPS."
              en: "On Flight Day 1, after separating from the ICPS, Pilot Victor Glover conducted an approximately 70-minute proximity operations demonstration, manually flying Orion to within about 30 feet of the ICPS."
            sources:
              - title: "NASA Blog: Live Artemis II Launch Day Updates (April 1, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/01/live-artemis-ii-launch-day-updates/"
                accessed: "2026-10-21"
              - title: "NASA Mission Page: Artemis II"
                url: "https://www.nasa.gov/mission/artemis-ii/"
                accessed: "2026-10-21"
      - id: "timeline-2-tli"
        order: 2
        dateLabel:
          es: "Día de vuelo 2 · 2 de abril de 2026, 7:49 p. m. EDT"
          en: "Flight Day 2 · April 2, 2026, 7:49 p.m. EDT"
        title:
          es: "Encendido de inyección translunar (TLI)"
          en: "Translunar injection (TLI) burn"
        description:
          es: >-
            A las 7:49 p. m. EDT del 2 de abril, el motor principal del Módulo de Servicio Europeo de Orion —capaz de generar hasta 6.700 libras de empuje— se encendió durante 5 minutos y 50 segundos. La maniobra consumió cerca de 1.000 libras de propulsante y colocó a la nave, de unas 58.000 libras de masa, en una ruta de cuatro días hacia la Luna bajo una trayectoria de retorno libre que garantizaba el regreso por gravedad terrestre incluso sin encendidos posteriores.
          en: >-
            At 7:49 p.m. EDT on April 2, the main engine on Orion's European Service Module—capable of up to 6,700 pounds of thrust—fired for 5 minutes and 50 seconds. Burning roughly 1,000 pounds of propellant at a spacecraft mass of about 58,000 pounds, the maneuver sent the crew out of Earth orbit on a four-day outbound path to the Moon along a free-return trajectory that used lunar and Earth gravity to ensure a safe return path.
        facts:
          - id: "mission-tli-burn"
            claim:
              es: "El encendido de inyección translunar ocurrió a las 7:49 p. m. EDT del 2 de abril de 2026; el motor principal del Módulo de Servicio Europeo (hasta 6.700 libras de empuje) funcionó durante 5 minutos y 50 segundos y consumió unas 1.000 libras de propulsante."
              en: "The translunar injection burn took place at 7:49 p.m. EDT on April 2, 2026; the European Service Module main engine (up to 6,700 pounds of thrust) fired for 5 minutes and 50 seconds, burning approximately 1,000 pounds of propellant."
            sources:
              - title: "NASA Blog: Artemis II Flight Day 2 — Orion Completes TLI Burn, Crew Begins Journey to the Moon (April 2, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/02/artemis-ii-flight-day-2-orion-completes-tli-burn-crew-begins-journey-to-the-moon/"
                accessed: "2026-10-21"
      - id: "timeline-3-outbound-soi"
        order: 3
        dateLabel:
          es: "Días de vuelo 3 a 6 · 3 al 6 de abril de 2026"
          en: "Flight Days 3 to 6 · April 3 to April 6, 2026"
        title:
          es: "Travesía de ida e ingreso en la esfera de influencia lunar"
          en: "Outbound coast and lunar sphere of influence entry"
        description:
          es: >-
            Durante el viaje de ida, la tripulación probó los sistemas de comunicación por radiofrecuencia de la Red del Espacio Profundo (DSN) y el sistema óptico de comunicaciones láser de Orion (O2O), además de fotografiar la Tierra menguante. A las 12:37 a. m. EDT del 6 de abril, al cierre del quinto día de misión, Orion cruzó hacia la esfera de influencia lunar, donde la gravedad de la Luna pasó a dominar la trayectoria de la nave.
          en: >-
            During the outbound coast, the crew tested Deep Space Network (DSN) radio communications and the Orion Artemis II Optical Communications System (O2O) while photographing the receding Earth. At 12:37 a.m. EDT on April 6, at the tail end of the fifth mission day, Orion entered the lunar sphere of influence, where the Moon's gravity became the dominant force acting on the spacecraft.
        facts:
          - id: "mission-lunar-soi-entry"
            claim:
              es: "Orion ingresó en la esfera de influencia lunar a las 12:37 a. m. EDT del 6 de abril de 2026."
              en: "Orion entered the lunar sphere of influence at 12:37 a.m. EDT on April 6, 2026."
            sources:
              - title: "NASA Image and Video Library: art002e024097"
                url: "https://images.nasa.gov/details/art002e024097"
                accessed: "2026-10-20"
              - title: "NASA Blog: Artemis II Flight Day 6 — Lunar Flyby Updates (April 6, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/06/artemis-ii-flight-day-6-lunar-flyby-updates/"
                accessed: "2026-10-21"
      - id: "timeline-4-flyby"
        order: 4
        dateLabel:
          es: "Día de vuelo 6 · 6 de abril de 2026, 1:56–7:25 p. m. EDT"
          en: "Flight Day 6 · April 6, 2026, 1:56–7:25 p.m. EDT"
        title:
          es: "Récord de distancia, sobrevuelo lunar y puesta y salida de la Tierra"
          en: "Distance record, lunar flyby, Earthset, and Earthrise"
        description:
          es: >-
            A la 1:56 p. m. EDT del 6 de abril, la tripulación superó el récord histórico de distancia humana a la Tierra establecido por Apolo 13 en 1970 (248.655 millas). Durante unas siete horas de observación lunar coordinada con el equipo científico en Houston y guiada por el software Lunar Targeting Plan, los astronautas fotografiaron cuencas de impacto como Orientale y Hertzsprung. A las 6:41 p. m. EDT contemplaron la puesta de la Tierra tras el limbo lunar; entre las 6:44 y las 7:25 p. m. EDT volaron en silencio de radio detrás de la Luna, alcanzando su máxima aproximación a la superficie a las 7:00 p. m. EDT (4.067 millas) y su distancia máxima a la Tierra a las 7:02 p. m. EDT (252.756 millas en el registro de vuelo; 252.760 millas en la estimación previa), antes de captar la salida de la Tierra a las 7:22 p. m. EDT.
          en: >-
            At 1:56 p.m. EDT on April 6, the crew surpassed the human distance record from Earth set by Apollo 13 in 1970 (248,655 miles). Over roughly seven hours of lunar observation coordinated with the Science Evaluation Room in Houston and guided by the custom Lunar Targeting Plan software, the astronauts documented impact basins including Orientale and Hertzsprung. They witnessed Earthset at 6:41 p.m. EDT, flew through a planned 41-minute radio blackout behind the Moon from 6:44 to 7:25 p.m. EDT—reaching closest approach to the lunar surface at 7:00 p.m. EDT (4,067 miles) and maximum distance from Earth at 7:02 p.m. EDT (252,756 miles in flight logs; 252,760 miles in pre-flight estimates)—and captured Earthrise at 7:22 p.m. EDT.
        facts:
          - id: "mission-flyby-times-and-distances"
            claim:
              es: "El 6 de abril de 2026, Artemis II superó las 248.655 millas de Apolo 13 a la 1:56 p. m. EDT, observó la puesta de la Tierra a las 6:41 p. m. EDT, permaneció sin comunicaciones entre las 6:44 y las 7:25 p. m. EDT, pasó a 4.067 millas de la Luna a las 7:00 p. m. EDT, alcanzó 252.756 millas de la Tierra a las 7:02 p. m. EDT y registró la salida de la Tierra a las 7:22 p. m. EDT."
              en: "On April 6, 2026, Artemis II passed Apollo 13's 248,655-mile mark at 1:56 p.m. EDT, observed Earthset at 6:41 p.m. EDT, flew in communications blackout from 6:44 to 7:25 p.m. EDT, reached closest lunar approach of 4,067 miles at 7:00 p.m. EDT, reached a peak distance of 252,756 miles from Earth at 7:02 p.m. EDT, and recorded Earthrise at 7:22 p.m. EDT."
            sources:
              - title: "NASA Blog: Artemis II Flight Day 6 — Lunar Flyby Updates (April 6, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/06/artemis-ii-flight-day-6-lunar-flyby-updates/"

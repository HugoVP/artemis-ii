                url: "https://images.nasa.gov/details/art002e009301"
                accessed: "2026-10-20"
              - title: "NASA Image and Video Library: art002e009575"
                url: "https://images.nasa.gov/details/art002e009575"
                accessed: "2026-10-20"
              - title: "Artemis II Preliminary Lunar Science Report (updated October 7, 2026)"
                url: "https://science.nasa.gov/feature/artemis-ii-preliminary-lunar-science-report/"
                accessed: "2026-10-20"
      - id: "timeline-6-splashdown"
        order: 6
        dateLabel:
          es: "Días de vuelo 7 a 10 · 7 al 10 de abril de 2026 (amerizaje 8:07 p. m. EDT)"
          en: "Flight Days 7 to 10 · April 7 to April 10, 2026 (splashdown 8:07 p.m. EDT)"
        title:
          es: "Viaje de regreso, reentrada atmosférica y amerizaje en el Pacífico"
          en: "Return coast, atmospheric re-entry, and Pacific splashdown"
        description:
          es: >-
            Orion salió de la esfera de influencia lunar el 7 de abril y durante el regreso envió a la Tierra más de 800 gigabytes de datos científicos. El viernes 10 de abril, el módulo de tripulación se separó del módulo de servicio a las 7:33 p. m. EDT e ingresó en la atmósfera a las 7:53 p. m. EDT a unos 400.000 pies de altitud y cerca de 35 veces la velocidad del sonido, soportando temperaturas cercanas a 3.000 °F en su escudo térmico y seis minutos de corte de comunicaciones. Tras desplegar sus paracaídas de frenado y sus tres paracaídas principales, Integrity amerizó frente a la costa de San Diego a las 8:07 p. m. EDT (5:07 p. m. PDT), y los equipos de recuperación de NASA y de la Marina de EE. UU. trasladaron a los cuatro astronautas en helicóptero al buque USS John P. Murtha antes de las 9:58 p. m. EDT.
          en: >-
            Orion exited the lunar sphere of influence on April 7 and downlinked more than 800 gigabytes of science data during the return coast. On Friday, April 10, the crew module separated from the service module at 7:33 p.m. EDT and hit atmospheric entry interface at 7:53 p.m. EDT at 400,000 feet and roughly 35 times the speed of sound, enduring heat-shield temperatures near 3,000 °F and a six-minute communications blackout. Following drogue and triple main parachute deployment, Integrity splashed down off San Diego at 8:07 p.m. EDT (5:07 p.m. PDT), and NASA Exploration Ground Systems and U.S. Navy recovery teams brought all four astronauts aboard USS John P. Murtha by helicopter before 9:58 p.m. EDT.
        facts:
          - id: "mission-reentry-and-splashdown"
            claim:
              es: "El 10 de abril de 2026, el módulo de tripulación se separó a las 7:33 p. m. EDT, inició la reentrada atmosférica a las 7:53 p. m. EDT (400.000 pies, ~Mach 35, ~3.000 °F), amerizó en el océano Pacífico cerca de San Diego a las 8:07 p. m. EDT (5:07 p. m. PDT) tras 9 días, 1 hora y 32 minutos de misión, y los cuatro tripulantes llegaron en helicóptero al USS John P. Murtha a las 9:58 p. m. EDT."
              en: "On April 10, 2026, the crew module separated at 7:33 p.m. EDT, reached entry interface at 7:53 p.m. EDT (400,000 feet, ~Mach 35, ~3,000 °F), splashed down in the Pacific Ocean off San Diego at 8:07 p.m. EDT (5:07 p.m. PDT) after a mission duration of 9 days, 1 hour, and 32 minutes, and all four astronauts arrived by helicopter aboard USS John P. Murtha by 9:58 p.m. EDT."
            sources:
              - title: "NASA Blog: Artemis II Flight Day 10 — Re-entry Live Updates (April 10, 2026)"
                url: "https://www.nasa.gov/blogs/missions/2026/04/10/artemis-ii-flight-day-10-re-entry-live-updates/"

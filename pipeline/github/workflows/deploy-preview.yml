name: Deploy preview

on:
  workflow_run:
    workflows: ['Preview build']
    types: [completed]

permissions:
  contents: read

jobs:
  eligibility:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SAME_REPO: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check current PR head before queuing
        id: head
        run: |
          if [ "${SAME_REPO}" != 'true' ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [ "${CURRENT_SHA}" = "${HEAD_SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: eligibility
    if: needs.eligibility.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: preview-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      SAME_REPO: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Fork runs deploy nothing
        if: env.SAME_REPO != 'true'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=success -f context=preview -f description="preview not available for fork PRs"
      - name: Check current PR head
        id: current
        if: env.SAME_REPO == 'true'
        run: |
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [ "${CURRENT_SHA}" = "${HEAD_SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SAME_REPO == 'true' && steps.current.outputs.current == 'true'
        with:
          name: preview-dist
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.SAME_REPO == 'true' && steps.current.outputs.current == 'true'
        with:
          node-version: 22
      # The artifact is data: nothing in it is executed, and its configuration files are ignored.
      - name: Reject Pages Worker entrypoints
        if: env.SAME_REPO == 'true' && steps.current.outputs.current == 'true'
        run: |
          if [ -e site/_worker.js ] || [ -L site/_worker.js ]; then
            echo "Refusing a Pages Worker entrypoint in the static artifact."
            exit 1
          fi
      - name: Upload to the staging Pages project (branch preview)
        if: env.SAME_REPO == 'true' && steps.current.outputs.current == 'true'
        run: |
          set -o pipefail
          rm -f site/wrangler.toml site/wrangler.json site/wrangler.jsonc site/.pr-number
          npx --yes wrangler@4.151.1 pages deploy site --project-name=artemis-ii-staging --branch="pr-${PR_NUMBER}" --commit-hash="${HEAD_SHA}" --commit-dirty=true | tee deploy.log
          URL=$(grep -o 'https://[^ ]*\.pages\.dev' deploy.log | tail -1)
          test -n "${URL}"
          echo "URL=${URL}" >> "$GITHUB_ENV"
      - name: Post the URL and report the preview status
        if: env.SAME_REPO == 'true' && steps.current.outputs.current == 'true'
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "Preview: ${URL}"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=success -f context=preview -f target_url="${URL}" -f description="preview deployed"

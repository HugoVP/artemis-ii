name: Media

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Shell until Stage 06 adds scripts/ingest: an empty manifest keeps the contract of the later jobs.
      - name: Generate variants and manifest
        run: |
          mkdir -p media-out
          if [ -f scripts/ingest.ts ]; then npm run ingest -- --build --out media-out; else echo '{"photos":[]}' > media-out/manifest.json; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media
          path: media-out

name: Preview build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stage 06 adds media generation here; until then the folder only holds what the build needs.
      - run: mkdir -p public/media
      - name: Build with the preview media layout
        run: npm run build
        env:
          MEDIA_BASE_URL: /media
          SITE_URL: ${{ vars.SITE_URL_STAGING }}
      - name: Record the PR number (data only)
        run: echo "${{ github.event.pull_request.number }}" > dist/.pr-number
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: dist
          retention-days: 7

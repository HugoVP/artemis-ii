name: Preview build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate media without credentials
        run: |
          mkdir -p media-out
          if [ -f scripts/ingest.ts ]; then
            npm run ingest -- --build --out media-out
          else
            echo '{"photos":[]}' > media-out/manifest.json
          fi
      - name: Build with the preview media layout
        run: npm run build
        env:
          MEDIA_BASE_URL: /media
          SITE_URL: ${{ vars.SITE_URL_STAGING }}
      - name: Record the PR number (data only)
        run: echo "${{ github.event.pull_request.number }}" > dist/.pr-number
      - name: Package and validate the complete static site
        run: node scripts/package-media.ts media-out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: dist
          retention-days: 7
      # QA-03: mobile reports for representative built routes; score thresholds start in Stage 11.
      - name: Lighthouse mobile reports
        continue-on-error: true
        run: |
          mkdir -p reports/lighthouse
          node scripts/lighthouse-pages.ts > reports/lighthouse/pages.tsv
          node scripts/serve-dist.ts > reports/lighthouse/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for ((attempt = 0; attempt < 30; attempt++)); do
            if curl -fsS http://127.0.0.1:4321/es/ > /dev/null; then break; fi
            sleep 1
          done
          failed=0
          while IFS=$'\t' read -r name path; do
            npx --yes lighthouse@13.5.0 "http://127.0.0.1:4321${path}" --chrome-flags="--headless --no-sandbox" --output=json --output=html --output-path="reports/lighthouse/${name}" > "reports/lighthouse/${name}.log" 2>&1 || failed=1
          done < reports/lighthouse/pages.tsv
          exit "$failed"
      - name: Retain Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-lighthouse-reports
          path: reports/lighthouse
          retention-days: 7
